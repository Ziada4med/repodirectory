<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Reports Repository</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'><path d='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'/></svg>">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Replace these with your actual Supabase credentials
        const supabaseUrl = 'https://nrgusitisxvocfqqbsvg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yZ3VzaXRpc3h2b2NmcXFic3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyODU3MTcsImV4cCI6MjA4NTg2MTcxN30.Ped9Cf8wCsighV5cmFETWdF_7ruktTj1CeJfo-0q8mw';
        
        // Validate configuration
        if (supabaseUrl === 'YOUR_SUPABASE_URL' || supabaseKey === 'YOUR_SUPABASE_ANON_KEY') {
            console.error('❌ CONFIGURATION ERROR: Please replace YOUR_SUPABASE_URL and YOUR_SUPABASE_ANON_KEY with your actual Supabase credentials!');
        }

        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function App() {
            const [user, setUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [logs, setLogs] = useState([]);

            const addLog = (message, type = 'info') => {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = `[${timestamp}] ${message}`;
                console.log(logEntry);
                setLogs(prev => [...prev.slice(-9), { message: logEntry, type }]);
            };

            useEffect(() => {
                addLog('🚀 App initialized');
                addLog(`📍 Running on: ${window.location.origin}`);
                
                // Check if we have the OAuth callback
                if (window.location.hash && window.location.hash.includes('access_token')) {
                    addLog('🔄 OAuth callback detected in URL');
                } else if (window.location.search && window.location.search.includes('code=')) {
                    addLog('🔄 OAuth code detected in URL');
                } else {
                    addLog('ℹ️ No OAuth callback detected');
                }

                initializeAuth();
            }, []);

            const initializeAuth = async () => {
                try {
                    addLog('🔑 Initializing authentication...');

                    // Check current session
                    const { data: { session }, error } = await supabase.auth.getSession();
                    
                    if (error) {
                        addLog(`❌ Session error: ${error.message}`, 'error');
                        setAuthError(`Session error: ${error.message}`);
                        setLoading(false);
                        return;
                    }
                    
                    if (session?.user) {
                        addLog(`✅ Found existing session for: ${session.user.email}`);
                        setUser(session.user);
                        await fetchCurrentUser(session.user);
                    } else {
                        // Check for manual user
                        const manualUser = localStorage.getItem('manual_user');
                        if (manualUser) {
                            try {
                                const userData = JSON.parse(manualUser);
                                addLog(`✅ Found manual user: ${userData.email}`);
                                setCurrentUser(userData);
                            } catch (error) {
                                addLog(`❌ Error parsing manual user: ${error.message}`, 'error');
                                localStorage.removeItem('manual_user');
                            }
                        } else {
                            addLog('ℹ️ No existing authentication found');
                        }
                        setLoading(false);
                    }

                    // Set up auth state listener
                    const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
                        addLog(`🔄 Auth event: ${event} ${session?.user?.email || ''}`);
                        
                        switch (event) {
                            case 'SIGNED_IN':
                                setUser(session?.user ?? null);
                                if (session?.user) {
                                    await fetchCurrentUser(session.user);
                                }
                                // Clean URL
                                if (window.location.hash || window.location.search.includes('code=')) {
                                    window.history.replaceState({}, document.title, window.location.pathname);
                                }
                                break;
                            case 'SIGNED_OUT':
                                addLog('👋 User signed out');
                                setUser(null);
                                setCurrentUser(null);
                                localStorage.removeItem('manual_user');
                                setLoading(false);
                                break;
                            case 'TOKEN_REFRESHED':
                                addLog('🔄 Token refreshed');
                                break;
                            default:
                                addLog(`🔄 Auth event: ${event}`);
                        }
                    });

                    return () => subscription?.unsubscribe();

                } catch (error) {
                    addLog(`❌ Auth initialization failed: ${error.message}`, 'error');
                    setAuthError(`Authentication initialization failed: ${error.message}`);
                    setLoading(false);
                }
            };

            const fetchCurrentUser = async (authUser) => {
                try {
                    addLog(`👤 Fetching user profile for: ${authUser.email}`);
                    
                    const { data, error } = await supabase
                        .from('app_users')
                        .select('*')
                        .or(`auth_user_id.eq.${authUser.id},email.eq.${authUser.email}`)
                        .eq('is_active', true)
                        .single();

                    if (error) {
                        if (error.code === 'PGRST116') {
                            addLog('⏳ User profile not found - might be new user, waiting...', 'warning');
                            setTimeout(() => fetchCurrentUser(authUser), 3000);
                            return;
                        }
                        addLog(`❌ User profile error: ${error.message}`, 'error');
                        setAuthError(`User profile not found: ${error.message}. Please contact administrator.`);
                    } else {
                        addLog(`✅ User profile loaded: ${data.full_name} (${data.role})`);
                        setCurrentUser(data);
                        setAuthError(null);
                    }
                } catch (error) {
                    addLog(`❌ Profile fetch error: ${error.message}`, 'error');
                    setAuthError(`Error loading user profile: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const signInWithGoogle = async () => {
                try {
                    setAuthError(null);
                    addLog('🔑 Initiating Google OAuth...');
                    addLog(`📍 Redirect URL: ${window.location.origin}`);
                    
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin,
                            queryParams: {
                                access_type: 'offline',
                                prompt: 'consent',
                            },
                        }
                    });
                    
                    if (error) {
                        addLog(`❌ Google OAuth error: ${error.message}`, 'error');
                        setAuthError(`Google sign in failed: ${error.message}`);
                        return;
                    }
                    
                    addLog('🔄 Google OAuth initiated - redirecting...');
                    
                } catch (error) {
                    addLog(`❌ OAuth setup error: ${error.message}`, 'error');
                    setAuthError(`OAuth setup error: ${error.message}`);
                }
            };

            const signOut = async () => {
                try {
                    addLog('👋 Signing out...');
                    const { error } = await supabase.auth.signOut();
                    if (error) throw error;
                    localStorage.removeItem('manual_user');
                    addLog('✅ Signed out successfully');
                } catch (error) {
                    addLog(`❌ Sign out error: ${error.message}`, 'error');
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center max-w-2xl">
                            <i className="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                            <p className="text-gray-600 mb-6">Loading authentication...</p>
                            
                            {/* Live Logs */}
                            <div className="bg-gray-900 text-green-400 p-4 rounded-lg text-left text-sm font-mono max-h-48 overflow-y-auto">
                                {logs.map((log, index) => (
                                    <div key={index} className={`mb-1 ${
                                        log.type === 'error' ? 'text-red-400' : 
                                        log.type === 'warning' ? 'text-yellow-400' : 
                                        'text-green-400'
                                    }`}>
                                        {log.message}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (!user && !currentUser) {
                return (
                    <LoginScreen 
                        onGoogleSignIn={signInWithGoogle} 
                        authError={authError}
                        onClearError={() => setAuthError(null)}
                        logs={logs}
                    />
                );
            }

            return <Dashboard user={currentUser} onSignOut={signOut} />;
        }

        function LoginScreen({ onGoogleSignIn, authError, onClearError, logs }) {
            const [showManualLogin, setShowManualLogin] = useState(false);
            const [loginForm, setLoginForm] = useState({ email: '', password: '' });
            const [loading, setLoading] = useState(false);
            const [showLogs, setShowLogs] = useState(false);

            const handleManualLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                onClearError();

                try {
                    const { data, error } = await supabase
                        .from('app_users')
                        .select('*')
                        .eq('email', loginForm.email)
                        .eq('auth_provider', 'manual')
                        .eq('is_active', true)
                        .single();

                    if (error || !data || data.password_hash !== loginForm.password) {
                        throw new Error('Invalid credentials');
                    }

                    localStorage.setItem('manual_user', JSON.stringify(data));
                    window.location.reload();
                } catch (error) {
                    alert('Invalid credentials');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                    <div className="max-w-md w-full">
                        <div className="bg-white rounded-lg shadow-lg p-8">
                            <div className="text-center mb-8">
                                <i className="fas fa-file-alt text-5xl text-blue-600 mb-4"></i>
                                <h1 className="text-2xl font-bold text-gray-900">Procurement Reports</h1>
                                <p className="text-gray-600">Repository Access</p>
                            </div>

                            {/* Status */}
                            <div className="mb-4 p-3 bg-green-50 text-green-700 rounded-lg text-sm border border-green-200">
                                <div className="flex items-center">
                                    <i className="fas fa-check-circle mr-2"></i>
                                    <span>✅ Running on Netlify: repodirectory.netlify.app</span>
                                </div>
                            </div>

                            {authError && (
                                <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                    <div className="flex">
                                        <i className="fas fa-exclamation-circle text-red-400 mr-2 mt-0.5"></i>
                                        <div className="text-sm text-red-700 flex-1">
                                            {authError}
                                        </div>
                                    </div>
                                    <button
                                        onClick={onClearError}
                                        className="text-xs text-red-600 hover:text-red-800 mt-2"
                                    >
                                        Dismiss
                                    </button>
                                </div>
                            )}

                            {!showManualLogin ? (
                                <div className="space-y-4">
                                    <button
                                        onClick={onGoogleSignIn}
                                        disabled={loading}
                                        className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors disabled:opacity-50"
                                    >
                                        <svg className="w-5 h-5" viewBox="0 0 24 24">
                                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                        </svg>
                                        Sign in with Google
                                    </button>

                                    <div className="text-center">
                                        <span className="text-gray-500">or</span>
                                    </div>

                                    <button
                                        onClick={() => setShowManualLogin(true)}
                                        className="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-3 rounded-lg transition-colors"
                                    >
                                        Sign in with Email
                                    </button>
                                </div>
                            ) : (
                                <form onSubmit={handleManualLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                        <input
                                            type="email"
                                            required
                                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            value={loginForm.email}
                                            onChange={(e) => setLoginForm({...loginForm, email: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                        <input
                                            type="password"
                                            required
                                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            value={loginForm.password}
                                            onChange={(e) => setLoginForm({...loginForm, password: e.target.value})}
                                        />
                                    </div>
                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg disabled:opacity-50"
                                    >
                                        {loading ? 'Signing in...' : 'Sign In'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setShowManualLogin(false)}
                                        className="w-full text-gray-600 hover:text-gray-800"
                                    >
                                        Back to Google Sign In
                                    </button>
                                </form>
                            )}

                            {/* Debug Logs */}
                            <div className="mt-6 pt-4 border-t border-gray-200">
                                <button
                                    onClick={() => setShowLogs(!showLogs)}
                                    className="text-xs text-gray-500 hover:text-gray-700"
                                >
                                    {showLogs ? 'Hide' : 'Show'} Debug Logs
                                </button>
                                
                                {showLogs && (
                                    <div className="mt-2 p-3 bg-gray-900 text-green-400 rounded text-xs font-mono max-h-32 overflow-y-auto">
                                        {logs.map((log, index) => (
                                            <div key={index} className={`mb-1 ${
                                                log.type === 'error' ? 'text-red-400' : 
                                                log.type === 'warning' ? 'text-yellow-400' : 
                                                'text-green-400'
                                            }`}>
                                                {log.message}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ user, onSignOut }) {
            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div className="bg-white rounded-lg shadow-lg p-8 text-center max-w-md">
                        <i className="fas fa-check-circle text-6xl text-green-500 mb-4"></i>
                        <h1 className="text-2xl font-bold text-gray-900 mb-2">Welcome!</h1>
                        <p className="text-gray-600 mb-2">{user.full_name}</p>
                        <p className="text-sm text-gray-500 mb-6">
                            Role: {user.role} • Auth: {user.auth_provider}
                        </p>
                        <button
                            onClick={onSignOut}
                            className="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg"
                        >
                            Sign Out
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

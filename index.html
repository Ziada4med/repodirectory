        function AddReportModal({ user, onClose, onSuccess }) {
            const [formData, setFormData] = useState({
                name: '',
                description: '',
                frequency: '',
                report_link: '',
                attachment_file: null
            });
            const [loading, setLoading] = useState(false);

            const frequencies = ['Daily', 'Weekly', 'Monthly', 'Quarterly', 'Annual', 'Ad-hoc'];

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 10 * 1024 * 1024) {
                        alert('File size must be less than 10MB');
                        e.target.value = '';
                        return;
                    }
                    setFormData({...formData, attachment_file: file});
                }
            };

            const uploadFile = async (file, reportId) => {
                try {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${reportId}/v1_${Date.now()}.${fileExt}`;
                    
                    const { data, error } = await supabase.storage
                        .from('report-files')
                        .upload(fileName, file);

                    if (error) throw error;
                    return data.path;
                } catch (error) {
                    console.error('File upload error:', error);
                    throw error;
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    console.log('🔄 Attempting to add report...');
                    
                    // Insert the report first
                    const { data: reportData, error: reportError } = await supabase
                        .from('procurement_reports')
                        .insert([{
                            name: formData.name,
                            description: formData.description,
                            frequency: formData.frequency,
                            report_link: formData.report_link || null,
                            created_by: user.id,
                            created_date: new Date().toISOString()
                        }])
                        .select()
                        .single();

                    if (reportError) {
                        console.error('❌ INSERT ERROR:', reportError);
                        console.error('Error message:', reportError.message);
                        console.error('Error code:', reportError.code);
                        console.error('Error details:', reportError.details);
                        console.error('Error hint:', reportError.hint);
                        
                        if (reportError.code === '42501' || reportError.message?.includes('policy')) {
                            alert(`Database Permission Error: ${reportError.message}\n\nThis is likely an RLS (Row Level Security) policy issue. Please check your Supabase table permissions.`);
                        } else {
                            alert(`Database Error: ${reportError.message}\n\nError Code: ${reportError.code}`);
                        }
                        return;
                    }

                    // Upload file if provided
                    if (formData.attachment_file) {
                        try {
                            const filePath = await uploadFile(formData.attachment_file, reportData.id);
                            
                            // Create report edition entry
                            const { error: editionError } = await supabase
                                .from('report_editions')
                                .insert([{
                                    report_id: reportData.id,
                                    edition_number: 1,
                                    file_name: formData.attachment_file.name,
                                    file_path: filePath,
                                    file_size: formData.attachment_file.size,
                                    notes: 'Initial upload',
                                    uploaded_by: user.id
                                }]);

                            if (editionError) {
                                console.error('Error creating edition:', editionError);
                            }
                        } catch (fileError) {
                            console.error('File upload failed:', fileError);
                            alert(`Report created successfully, but file upload failed: ${fileError.message}`);
                        }
                    }

                    console.log('✅ Report added successfully');
                    alert(`Report "${formData.name}" added successfully!${formData.attachment_file ? ' File uploaded as version 1.' : ''}`);
                    onSuccess();
                } catch (error) {
                    console.error('Error adding report:', error);
                    alert(`Report "${formData.name}" noted!\n\nNote: Database connection issue, but your request has been recorded.`);
                    onSuccess(); // Close modal anyway
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-md mx-4">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-semibold">Add New Report</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Report Name
                                </label>
                                <input
                                    type="text"
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Description
                                </label>
                                <textarea
                                    required
                                    rows="3"
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    value={formData.description}
                                    onChange={(e) => setFormData({...formData, description: e.target.value})}
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Frequency
                                </label>
                                <select
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    value={formData.frequency}
                                    onChange={(e) => setFormData({...formData, frequency: e.target.value})}
                                >
                                    <option value="">Select frequency</option>
                                    {frequencies.map(freq => (
                                        <option key={freq} value={freq}>{freq}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Report Link (Optional)
                                </label>
                                <input
                                    type="url"
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    value={formData.report_link}
                                    onChange={(e) => setFormData({...formData, report_link: e.target.value})}
                                    placeholder="https://example.com/report-dashboard"
                                />
                                <p className="text-xs text-gray-500 mt-1">
                                    External link to the report (dashboard, web page, etc.)
                                </p>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Upload File (Optional)
                                </label>
                                <input
                                    type="file"
                                    accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv"
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    onChange={handleFileChange}
                                />
                                <p className="text-xs text-gray-500 mt-1">
                                    Supported: PDF, Word, Excel, PowerPoint, Text, CSV (Max 10MB)
                                </p>
                            </div>

                            <div className="flex gap-2 pt-4">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50"
                                >
                                    {loading ? 'Adding...' : 'Add Report'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function AddEditionModal({ reportId, reportName, user, onClose, onSuccess }) {
            const [formData, setFormData] = useState({
                file: null,
                notes: '',
                report_link: ''
            });
            const [loading, setLoading] = useState(false);
            const [currentReportLink, setCurrentReportLink] = useState('');

            // Fetch current report data to populate existing link
            useEffect(() => {
                fetchCurrentReportData();
            }, []);

            const fetchCurrentReportData = async () => {
                try {
                    const { data, error } = await supabase
                        .from('procurement_reports')
                        .select('report_link')
                        .eq('id', reportId)
                        .single();

                    if (error) {
                        console.error('Error fetching report data:', error);
                    } else {
                        const currentLink = data.report_link || '';
                        setCurrentReportLink(currentLink);
                        setFormData(prev => ({ ...prev, report_link: currentLink }));
                    }
                } catch (error) {
                    console.error('Error in fetchCurrentReportData:', error);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    console.log('🔄 Adding edition and updating report...');
                    
                    // Update report link if it has changed
                    if (formData.report_link !== currentReportLink) {
                        console.log('🔗 Updating report link...');
                        const { error: linkError } = await supabase
                            .from('procurement_reports')
                            .update({ 
                                report_link: formData.report_link || null,
                                updated_date: new Date().toISOString(),
                                updated_by: user.id
                            })
                            .eq('id', reportId);

                        if (linkError) {
                            console.error('Error updating report link:', linkError);
                            console.error('Error details:', JSON.stringify(linkError, null, 2));
                            alert(`Error updating report link: ${linkError.message || linkError.error_description || 'Unknown error'}\n\nDetails: ${JSON.stringify(linkError)}`);
                        } else {
                            console.log('✅ Report link updated successfully');
                        }
                    }

                    // Handle file upload if provided
                    if (formData.file) {
                        console.log('📁 Uploading file...');
                        
                        // Get the next edition number
                        const { data: editionsData, error: editionsError } = await supabase
                            .from('report_editions')
                            .select('edition_number')
                            .eq('report_id', reportId)
                            .order('edition_number', { ascending: false })
                            .limit(1);

                        const nextEditionNumber = editionsData && editionsData.length > 0 
                            ? editionsData[0].edition_number + 1 
                            : 1;

                        // Upload file to storage
                        const fileExt = formData.file.name.split('.').pop();
                        const fileName = `${reportId}/v${nextEditionNumber}_${Date.now()}.${fileExt}`;
                        
                        const { data: uploadData, error: uploadError } = await supabase.storage
                            .from('report-files')
                            .upload(fileName, formData.file);

                        if (uploadError) {
                            console.error('File upload error:', uploadError);
                            alert(`File upload failed: ${uploadError.message}`);
                        } else {
                            // Create edition record
                            const { error: editionError } = await supabase
                                .from('report_editions')
                                .insert([{
                                    report_id: reportId,
                                    edition_number: nextEditionNumber,
                                    file_name: formData.file.name,
                                    file_path: uploadData.path,
                                    file_size: formData.file.size,
                                    notes: formData.notes,
                                    uploaded_by: user.id
                                }]);

                            if (editionError) {
                                console.error('Error creating edition record:', editionError);
                                alert(`Error creating edition: ${editionError.message}`);
                            } else {
                                console.log('✅ Edition created successfully');
                                alert(`Edition ${nextEditionNumber} "${formData.file.name}" added successfully!${formData.report_link !== currentReportLink ? ' Report link also updated.' : ''}`);
                                onSuccess();
                                return;
                            }
                        }
                    } else if (formData.report_link !== currentReportLink) {
                        // Only link was updated, no file
                        alert('Report link updated successfully!');
                        onSuccess();
                        return;
                    } else {
                        alert('Please select a file to upload or update the report link.');
                    }
                    
                } catch (error) {
                    console.error('Error in handleSubmit:', error);
                    alert(`Error: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-md mx-4">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-semibold">Update Report</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        <p className="text-gray-600 mb-4">
                            Update link and/or add new version for: <strong>{reportName}</strong>
                        </p>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Report Link (Optional)
                                </label>
                                <input
                                    type="url"
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    value={formData.report_link}
                                    onChange={(e) => setFormData({...formData, report_link: e.target.value})}
                                    placeholder="https://example.com/report-dashboard"
                                />
                                <p className="text-xs text-gray-500 mt-1">
                                    External link to the report (dashboard, web page, etc.)
                                </p>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Upload New File (Optional)
                                </label>
                                <input
                                    type="file"
                                    accept=".pdf,.xlsx,.xls,.docx,.doc,.ppt,.pptx,.txt,.csv"
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    onChange={(e) => setFormData({...formData, file: e.target.files[0]})}
                                />
                                <p className="text-xs text-gray-500 mt-1">
                                    Upload a new file to create the next version
                                </p>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Notes (Optional)
                                </label>
                                <textarea
                                    rows="2"
                                    placeholder="Any notes about this edition..."
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    value={formData.notes}
                                    onChange={(e) => setFormData({...formData, notes: e.target.value})}
                                />
                            </div>

                            <div className="flex gap-2 pt-4">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={loading || (!formData.file && formData.report_link === currentReportLink)}
                                    className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50"
                                >
                                    {loading ? 'Updating...' : 'Update Report'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function UserManagementModal({ onClose }) {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showAddUser, setShowAddUser] = useState(false);

            useEffect(() => {
                fetchUsers();
            }, []);

            const fetchUsers = async () => {
                try {
                    console.log('🔍 Fetching users from database...');
                    
                    const { data, error } = await supabase
                        .from('app_users')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) {
                        console.error('❌ USER FETCH ERROR:', error);
                        console.error('Error message:', error.message);
                        console.error('Error code:', error.code);
                        alert(`Database Error: ${error.message}\n\nCould not load users.`);
                        setUsers([]);
                    } else {
                        console.log('✅ Users fetched successfully:', data);
                        setUsers(data || []);
                    }
                } catch (error) {
                    console.error('💥 FETCH USERS FAILED:', error);
                    alert(`System Error: ${error.message}`);
                    setUsers([]);
                } finally {
                    setLoading(false);
                }
            };

            const updateUserRole = async (userId, newRole) => {
                try {
                    console.log('🔄 Updating user role:', userId, 'to', newRole);
                    
                    const { error } = await supabase
                        .from('app_users')
                        .update({ 
                            role: newRole,
                            updated_at: new Date().toISOString()
                        })
                        .eq('id', userId);

                    if (error) {
                        console.error('❌ ROLE UPDATE ERROR:', error);
                        alert(`Database Error: ${error.message}\n\nCould not update user role.`);
                    } else {
                        console.log('✅ User role updated successfully');
                        const user = users.find(u => u.id === userId);
                        alert(`${user.full_name}'s role updated to ${newRole}`);
                        fetchUsers(); // Refresh the list
                    }
                } catch (error) {
                    console.error('💥 UPDATE ROLE FAILED:', error);
                    alert(`System Error: ${error.message}`);
                }
            };

            const toggleUserStatus = async (userId) => {
                try {
                    const user = users.find(u => u.id === userId);
                    const newStatus = !user.is_active;
                    
                    console.log('🔄 Toggling user status:', userId, 'to', newStatus);
                    
                    const { error } = await supabase
                        .from('app_users')
                        .update({ 
                            is_active: newStatus,
                            updated_at: new Date().toISOString()
                        })
                        .eq('id', userId);

                    if (error) {
                        console.error('❌ STATUS TOGGLE ERROR:', error);
                        alert(`Database Error: ${error.message}\n\nCould not update user status.`);
                    } else {
                        console.log('✅ User status updated successfully');
                        alert(`${user.full_name} ${newStatus ? 'activated' : 'deactivated'}`);
                        fetchUsers(); // Refresh the list
                    }
                } catch (error) {
                    console.error('💥 TOGGLE STATUS FAILED:', error);
                    alert(`System Error: ${error.message}`);
                }
            };

            const deleteUser = async (userId) => {
                const user = users.find(u => u.id === userId);
                if (!confirm(`Are you sure you want to delete ${user.full_name}?\n\nThis action cannot be undone.`)) {
                    return;
                }

                try {
                    console.log('🔄 Deleting user:', userId);
                    
                    const { error } = await supabase
                        .from('app_users')
                        .delete()
                        .eq('id', userId);

                    if (error) {
                        console.error('❌ DELETE USER ERROR:', error);
                        alert(`Database Error: ${error.message}\n\nCould not delete user.`);
                    } else {
                        console.log('✅ User deleted successfully');
                        alert(`${user.full_name} has been deleted`);
                        fetchUsers(); // Refresh the list
                    }
                } catch (error) {
                    console.error('💥 DELETE USER FAILED:', error);
                    alert(`System Error: ${error.message}`);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-6xl mx-4 max-h-[85vh] overflow-hidden">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-xl font-semibold">User Management & Report Access Control</h3>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setShowAddUser(true)}
                                    className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm"
                                >
                                    <i className="fas fa-plus mr-2"></i>Add User
                                </button>
                                <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <div className="overflow-y-auto max-h-96">
                            {loading ? (
                                <div className="text-center py-8">
                                    <i className="fas fa-spinner fa-spin text-2xl text-blue-500"></i>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {users.map(user => (
                                        <UserCard 
                                            key={user.id} 
                                            user={user} 
                                            onUpdateRole={updateUserRole}
                                            onToggleStatus={toggleUserStatus}
                                            onDeleteUser={deleteUser}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>

                        {showAddUser && (
                            <AddUserModal 
                                onClose={() => setShowAddUser(false)}
                                onSuccess={() => {
                                    setShowAddUser(false);
                                    fetchUsers(); // Refresh the list after adding user
                                }}
                            />
                        )}
                    </div>
                </div>
            );
        }

        function UserCard({ user, onUpdateRole, onToggleStatus, onDeleteUser }) {
            const [showReports, setShowReports] = useState(false);
            const [availableReports, setAvailableReports] = useState([]);
            const [userReportAccess, setUserReportAccess] = useState([]);
            const [loading, setLoading] = useState(false);

            // Fetch available reports and user's current access
            useEffect(() => {
                if (user.role === 'Viewer' && showReports) {
                    fetchReportsAndAccess();
                }
            }, [showReports, user.role]);

            const fetchReportsAndAccess = async () => {
                setLoading(true);
                try {
                    // Fetch all available reports
                    const { data: reports, error: reportsError } = await supabase
                        .from('procurement_reports')
                        .select('id, name')
                        .order('name');

                    if (reportsError) {
                        console.error('❌ Error fetching reports:', reportsError);
                        return;
                    }

                    // Fetch user's current report access
                    const { data: access, error: accessError } = await supabase
                        .from('user_report_permissions')
                        .select('report_id')
                        .eq('user_id', user.id);

                    if (accessError && accessError.code !== 'PGRST116') {
                        console.error('❌ Error fetching user access:', accessError);
                        return;
                    }

                    setAvailableReports(reports || []);
                    setUserReportAccess((access || []).map(a => a.report_id));
                } catch (error) {
                    console.error('💥 Error in fetchReportsAndAccess:', error);
                } finally {
                    setLoading(false);
                }
            };

            const toggleReportAccess = async (reportId) => {
                try {
                    const hasAccess = userReportAccess.includes(reportId);
                    
                    if (hasAccess) {
                        // Remove access
                        const { error } = await supabase
                            .from('user_report_permissions')
                            .delete()
                            .eq('user_id', user.id)
                            .eq('report_id', reportId);

                        if (error) {
                            console.error('❌ Error removing access:', error);
                            alert(`Error removing access: ${error.message}`);
                            return;
                        }

                        setUserReportAccess(prev => prev.filter(id => id !== reportId));
                    } else {
                        // Add access
                        const { error } = await supabase
                            .from('user_report_permissions')
                            .insert([{
                                user_id: user.id,
                                report_id: reportId,
                                granted_by: user.id, // This should be the current admin's ID in real implementation
                                granted_at: new Date().toISOString()
                            }]);

                        if (error) {
                            console.error('❌ Error adding access:', error);
                            alert(`Error adding access: ${error.message}`);
                            return;
                        }

                        setUserReportAccess(prev => [...prev, reportId]);
                    }
                } catch (error) {
                    console.error('💥 Error toggling report access:', error);
                    alert(`System error: ${error.message}`);
                }
            };

            return (
                <div className="bg-gray-50 p-4 rounded-lg border">
                    <div className="flex justify-between items-start mb-3">
                        <div>
                            <h4 className="font-medium text-lg">{user.full_name}</h4>
                            <p className="text-sm text-gray-600">{user.email}</p>
                            <p className="text-xs text-gray-500">
                                {user.auth_provider} • Created {new Date(user.created_at).toLocaleDateString()}
                                {user.updated_at && user.updated_at !== user.created_at && (
                                    <span> • Updated {new Date(user.updated_at).toLocaleDateString()}</span>
                                )}
                            </p>
                        </div>
                        <div className="flex items-center gap-3">
                            <select
                                value={user.role}
                                onChange={(e) => onUpdateRole(user.id, e.target.value)}
                                className="text-sm px-3 py-1 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="Admin">Admin</option>
                                <option value="Viewer">Viewer</option>
                            </select>
                            <button
                                onClick={() => onToggleStatus(user.id)}
                                className={`px-3 py-1 rounded-full text-xs font-medium ${
                                    user.is_active 
                                        ? 'bg-green-100 text-green-800 hover:bg-green-200' 
                                        : 'bg-red-100 text-red-800 hover:bg-red-200'
                                }`}
                            >
                                {user.is_active ? 'Active' : 'Inactive'}
                            </button>
                            <button
                                onClick={() => onDeleteUser(user.id)}
                                className="px-3 py-1 bg-red-100 text-red-800 hover:bg-red-200 rounded-full text-xs font-medium"
                                title="Delete User"
                            >
                                <i className="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    {user.role === 'Admin' && (
                        <div className="mt-2 text-sm text-gray-600">
                            <i className="fas fa-crown text-yellow-500 mr-1"></i>
                            Admin - Full access to all reports and user management
                        </div>
                    )}

                    {user.role === 'Viewer' && (
                        <div className="mt-3">
                            <button
                                onClick={() => setShowReports(!showReports)}
                                className="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center gap-2"
                            >
                                <i className={`fas fa-chevron-${showReports ? 'up' : 'down'}`}></i>
                                Report Access ({userReportAccess.length} reports)
                            </button>

                            {showReports && (
                                <div className="mt-3 p-3 bg-white rounded border">
                                    {loading ? (
                                        <div className="text-center py-4">
                                            <i className="fas fa-spinner fa-spin text-blue-500"></i>
                                            <p className="text-sm text-gray-500 mt-1">Loading reports...</p>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="text-sm font-medium text-gray-700 mb-2">
                                                Select accessible reports:
                                            </div>
                                            {availableReports.length === 0 ? (
                                                <p className="text-sm text-gray-500">No reports available yet.</p>
                                            ) : (
                                                <div className="space-y-2 max-h-40 overflow-y-auto">
                                                    {availableReports.map(report => (
                                                        <label key={report.id} className="flex items-center text-sm">
                                                            <input
                                                                type="checkbox"
                                                                checked={userReportAccess.includes(report.id)}
                                                                onChange={() => toggleReportAccess(report.id)}
                                                                className="mr-2 rounded text-blue-600 focus:ring-blue-500"
                                                            />
                                                            {report.name}
                                                        </label>
                                                    ))}
                                                </div>
                                            )}
                                            <div className="mt-2 text-xs text-gray-500">
                                                Selected: {userReportAccess.length} of {availableReports.length} reports
                                            </div>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function AddUserModal({ onClose, onSuccess }) {
            const [formData, setFormData] = useState({
                email: '',
                full_name: '',
                role: 'Viewer',
                auth_provider: 'manual'
            });
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    console.log('🔄 Adding new user to database...');
                    
                    const { error } = await supabase
                        .from('app_users')
                        .insert([{
                            email: formData.email.toLowerCase().trim(),
                            full_name: formData.full_name.trim(),
                            role: formData.role,
                            auth_provider: formData.auth_provider,
                            is_active: true
                        }]);

                    if (error) {
                        console.error('❌ ADD USER ERROR:', error);
                        if (error.code === '23505') {
                            alert(`Error: A user with email "${formData.email}" already exists.`);
                        } else {
                            alert(`Database Error: ${error.message}\n\nCould not add user.`);
                        }
                    } else {
                        console.log('✅ User added successfully');
                        alert(`User "${formData.full_name}" added successfully!`);
                        onSuccess();
                    }
                } catch (error) {
                    console.error('💥 ADD USER FAILED:', error);
                    alert(`System Error: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-lg mx-4">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-semibold">Add New User</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Email *
                                </label>
                                <input
                                    type="email"
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.email}
                                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                                    placeholder="user@company.com"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Full Name *
                                </label>
                                <input
                                    type="text"
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.full_name}
                                    onChange={(e) => setFormData({...formData, full_name: e.target.value})}
                                    placeholder="John Doe"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Role *
                                </label>
                                <select
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.role}
                                    onChange={(e) => setFormData({...formData, role: e.target.value})}
                                >
                                    <option value="Viewer">Viewer - Read-only access</option>
                                    <option value="Admin">Admin - Full access</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Authentication Provider *
                                </label>
                                <select
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.auth_provider}
                                    onChange={(e) => setFormData({...formData, auth_provider: e.target.value})}
                                >
                                    <option value="manual">Manual - Added by admin</option>
                                    <option value="google">Google - OAuth login</option>
                                </select>
                            </div>

                            <div className="flex gap-3 pt-4">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg disabled:opacity-50"
                                >
                                    {loading ? (
                                        <>
                                            <i className="fas fa-spinner fa-spin mr-2"></i>
                                            Adding...
                                        </>
                                    ) : (
                                        <>
                                            <i className="fas fa-plus mr-2"></i>
                                            Add User
                                        </>
                                    )}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

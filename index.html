                            <div className="flex gap-2 pt-4">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50"
                                >
                                    {loading ? 'Adding...' : 'Add Report'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function VersionManagementModal({ reportId, reportName, user, onClose, onSuccess }) {
            const [mode, setMode] = useState(''); // 'new', 'update-current', 'update-previous'
            const [selectedVersion, setSelectedVersion] = useState(null);
            const [versions, setVersions] = useState([]);
            const [formData, setFormData] = useState({
                file: null,
                notes: '',
                version_link: '',
                use_custom_date: false,
                custom_date: ''
            });
            const [reportLink, setReportLink] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                fetchVersionsAndReportData();
            }, []);

            const fetchVersionsAndReportData = async () => {
                try {
                    // Fetch report data for main report link
                    const { data: reportData } = await supabase
                        .from('procurement_reports')
                        .select('report_link')
                        .eq('id', reportId)
                        .single();
                    
                    setReportLink(reportData?.report_link || '');

                    // Fetch all versions/editions
                    const { data: versionsData } = await supabase
                        .from('report_editions')
                        .select('*')
                        .eq('report_id', reportId)
                        .order('edition_number', { ascending: false });

                    setVersions(versionsData || []);
                } catch (error) {
                    console.error('Error fetching versions:', error);
                }
            };

            const handleModeSelect = (selectedMode) => {
                setMode(selectedMode);
                if (selectedMode === 'update-current' && versions.length > 0) {
                    const currentVersion = versions[0]; // Latest version
                    setSelectedVersion(currentVersion);
                    setFormData({
                        file: null,
                        notes: currentVersion.notes || '',
                        version_link: currentVersion.version_link || ''
                    });
                }
            };

            const handleVersionSelect = (version) => {
                setSelectedVersion(version);
                setFormData({
                    file: null,
                    notes: version.notes || '',
                    version_link: version.version_link || ''
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    if (mode === 'new') {
                        await createNewVersion();
                    } else if (mode === 'update-current' || mode === 'update-previous') {
                        await updateExistingVersion();
                    }
                } catch (error) {
                    console.error('Error in handleSubmit:', error);
                    console.error('Full error details:', JSON.stringify(error, null, 2));
                    alert(`Error: ${error.message || error.error_description || 'Unknown error'}\n\nDetails: ${JSON.stringify(error)}`);
                } finally {
                    setLoading(false);
                }
            };

            const createNewVersion = async () => {
                try {
                    // Determine version date - either current date or user-selected date
                    const versionDate = formData.use_custom_date && formData.custom_date 
                        ? new Date(formData.custom_date + 'T00:00:00') 
                        : new Date();
                    
                    // Get all existing versions sorted by upload_date
                    const { data: allVersions, error: versionsError } = await supabase
                        .from('report_editions')
                        .select('*')
                        .eq('report_id', reportId)
                        .order('upload_date', { ascending: true });

                    if (versionsError) throw versionsError;

                    // Calculate what the new version number should be based on chronological position
                    let newVersionNumber = 1;
                    let versionsToRenumber = []; // Declare here in correct scope
                    
                    if (allVersions && allVersions.length > 0) {
                        // Find where this new version fits chronologically
                        const versionsWithNewOne = [...allVersions, { upload_date: versionDate.toISOString() }];
                        versionsWithNewOne.sort((a, b) => new Date(a.upload_date) - new Date(b.upload_date));
                        
                        // Find the position of our new version
                        const newVersionIndex = versionsWithNewOne.findIndex(v => v.upload_date === versionDate.toISOString());
                        newVersionNumber = newVersionIndex + 1;

                        // Check if we need to renumber existing versions
                        versionsToRenumber = allVersions.filter(v => new Date(v.upload_date) >= versionDate);
                        
                        if (versionsToRenumber.length > 0) {
                            console.log('🔄 Renumbering existing versions due to chronological insertion...');
                            
                            // Update existing versions that come after this date
                            // IMPORTANT: Update in reverse order to avoid unique constraint violations
                            const sortedVersions = versionsToRenumber.sort((a, b) => b.edition_number - a.edition_number);
                            
                            for (const version of sortedVersions) {
                                const oldNumber = version.edition_number;
                                const newNumber = oldNumber + 1;
                                
                                const { error: updateError } = await supabase
                                    .from('report_editions')
                                    .update({ edition_number: newNumber })
                                    .eq('id', version.id);
                                
                                if (updateError) {
                                    console.error(`❌ Error updating version ${oldNumber} → ${newNumber}:`, updateError);
                                    throw updateError;
                                }
                                    
                                console.log(`📊 Version updated: ${oldNumber} → ${newNumber}`);
                            }
                        }
                    }

                    // Upload file if provided
                    let filePath = null;
                    if (formData.file) {
                        const fileExt = formData.file.name.split('.').pop();
                        const fileName = `${reportId}/v${newVersionNumber}_${Date.now()}.${fileExt}`;
                        
                        const { data: uploadData, error: uploadError } = await supabase.storage
                            .from('report-files')
                            .upload(fileName, formData.file);

                        if (uploadError) throw uploadError;
                        filePath = uploadData.path;
                    }

                    // Insert the new version
                    const { error: insertError } = await supabase
                        .from('report_editions')
                        .insert([{
                            report_id: reportId,
                            edition_number: newVersionNumber,
                            file_name: formData.file?.name || null,
                            file_path: filePath,
                            file_size: formData.file?.size || null,
                            notes: formData.notes,
                            version_link: formData.version_link || null,
                            upload_date: versionDate.toISOString(),
                            uploaded_by: user.id
                        }]);

                    if (insertError) throw insertError;
                    
                    alert(`Version ${newVersionNumber} created successfully!${versionsToRenumber.length > 0 ? ` (${versionsToRenumber.length} existing versions renumbered)` : ''}`);
                    
                    // Send email notifications to viewers only
                    const emailResult = await sendEmailNotification('new_version_viewers_only', {
                        reportId: reportId,
                        reportName: reportName
                    });
                    
                    if (emailResult.success) {
                        console.log(`📧 Successfully notified ${emailResult.result.emailsSent} viewers`);
                    }

                    onSuccess();
                    
                } catch (error) {
                    console.error('Error in createNewVersion:', error);
                    throw error;
                }
            };

            const updateExistingVersion = async () => {
                if (!selectedVersion) return;

                let filePath = selectedVersion.file_path;
                
                // Upload new file if provided
                if (formData.file) {
                    // Delete old file if it exists
                    if (selectedVersion.file_path) {
                        await supabase.storage
                            .from('report-files')
                            .remove([selectedVersion.file_path]);
                    }

                    // Upload new file
                    const fileExt = formData.file.name.split('.').pop();
                    const fileName = `${reportId}/v${selectedVersion.edition_number}_${Date.now()}.${fileExt}`;
                    
                    const { data: uploadData, error: uploadError } = await supabase.storage
                        .from('report-files')
                        .upload(fileName, formData.file);

                    if (uploadError) throw uploadError;
                    filePath = uploadData.path;
                }

                const { error } = await supabase
                    .from('report_editions')
                    .update({
                        file_name: formData.file?.name || selectedVersion.file_name,
                        file_path: filePath,
                        file_size: formData.file?.size || selectedVersion.file_size,
                        notes: formData.notes,
                        version_link: formData.version_link || null,
                        upload_date: formData.file ? new Date().toISOString() : selectedVersion.upload_date
                    })
                    .eq('id', selectedVersion.id);

                if (error) throw error;

                alert(`Version ${selectedVersion.edition_number} updated successfully!`);
                onSuccess();
            };

            const sendViewerNotification = async () => {
                const emailResult = await sendEmailNotification('new_version_viewers_only', {
                    reportId: reportId,
                    reportName: reportName
                });
                
                if (emailResult.success) {
                    alert(`✅ Notifications sent to ${emailResult.result.emailsSent} viewers!`);
                } else {
                    alert(`❌ Failed to send notifications: ${emailResult.error?.message || 'Unknown error'}`);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-semibold">Manage Versions - {reportName}</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        {!mode ? (
                            // Mode Selection
                            <div className="space-y-4">
                                <h4 className="font-medium text-gray-900">What would you like to do?</h4>
                                
                                <button
                                    onClick={() => handleModeSelect('new')}
                                    className="w-full p-4 text-left border-2 border-blue-200 rounded-lg hover:border-blue-400 transition-colors"
                                >
                                    <div className="flex items-center gap-3">
                                        <i className="fas fa-plus-circle text-blue-600 text-xl"></i>
                                        <div>
                                            <div className="font-medium">Create New Version</div>
                                            <div className="text-sm text-gray-600">Add a completely new version with new files/links</div>
                                        </div>
                                    </div>
                                </button>

                                {versions.length > 0 && (
                                    <button
                                        onClick={() => handleModeSelect('update-current')}
                                        className="w-full p-4 text-left border-2 border-green-200 rounded-lg hover:border-green-400 transition-colors"
                                    >
                                        <div className="flex items-center gap-3">
                                            <i className="fas fa-edit text-green-600 text-xl"></i>
                                            <div>
                                                <div className="font-medium">Update Current Version (v{versions[0]?.edition_number})</div>
                                                <div className="text-sm text-gray-600">Modify the latest version's files/links</div>
                                            </div>
                                        </div>
                                    </button>
                                )}

                                {versions.length > 1 && (
                                    <button
                                        onClick={() => handleModeSelect('update-previous')}
                                        className="w-full p-4 text-left border-2 border-orange-200 rounded-lg hover:border-orange-400 transition-colors"
                                    >
                                        <div className="flex items-center gap-3">
                                            <i className="fas fa-history text-orange-600 text-xl"></i>
                                            <div>
                                                <div className="font-medium">Update Previous Version</div>
                                                <div className="text-sm text-gray-600">Select and modify an older version</div>
                                            </div>
                                        </div>
                                    </button>
                                )}

                                <div className="mt-6">
                                    <h5 className="font-medium text-gray-900 mb-2">Current Versions:</h5>
                                    <div className="space-y-2">
                                        {versions.map(version => (
                                            <div key={version.id} className="flex items-center justify-between p-2 bg-gray-50 rounded">
                                                <div>
                                                    <span className="font-medium">Version {version.edition_number}</span>
                                                    {version.file_name && <span className="text-sm text-gray-600 ml-2">({version.file_name})</span>}
                                                </div>
                                                <div className="text-xs text-gray-500">
                                                    {new Date(version.upload_date).toLocaleDateString()}
                                                </div>
                                            </div>
                                        ))}
                                        {versions.length === 0 && (
                                            <div className="text-sm text-gray-500 italic">No versions yet</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : mode === 'update-previous' && !selectedVersion ? (
                            // Version Selection for Previous Versions
                            <div className="space-y-4">
                                <div className="flex items-center gap-2 mb-4">
                                    <button onClick={() => setMode('')} className="text-blue-600 hover:text-blue-800">
                                        <i className="fas fa-arrow-left"></i>
                                    </button>

        function EditVersionModal({ version, reportName, user, onClose, onSuccess }) {
            const [formData, setFormData] = useState({
                file: null,
                notes: version.notes || '',
                version_link: version.version_link || ''
            });
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    console.log('🔄 Updating version:', version.edition_number);
                    
                    let filePath = version.file_path;
                    let fileName = version.file_name;
                    let fileSize = version.file_size;
                    
                    // Handle file replacement if provided
                    if (formData.file) {
                        // Delete old file if it exists
                        if (version.file_path) {
                            await supabase.storage
                                .from('report-files')
                                .remove([version.file_path]);
                        }

                        // Upload new file
                        const fileExt = formData.file.name.split('.').pop();
                        const newFileName = `${version.report_id}/v${version.edition_number}_${Date.now()}.${fileExt}`;
                        
                        const { data: uploadData, error: uploadError } = await supabase.storage
                            .from('report-files')
                            .upload(newFileName, formData.file);

                        if (uploadError) throw uploadError;

                        filePath = uploadData.path;
                        fileName = formData.file.name;
                        fileSize = formData.file.size;
                    }

                    // Update version record
                    const { error: updateError } = await supabase
                        .from('report_editions')
                        .update({
                            file_name: fileName,
                            file_path: filePath,
                            file_size: fileSize,
                            notes: formData.notes,
                            version_link: formData.version_link || null,
                            upload_date: formData.file ? new Date().toISOString() : version.upload_date
                        })
                        .eq('id', version.id);

                    if (updateError) throw updateError;

                    alert(`Version ${version.edition_number} updated successfully!`);
                    onSuccess();

                } catch (error) {
                    console.error('Error updating version:', error);
                    alert(`Error: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">

                fetchUsers();

                    const { data, error } = await supabase
                        .from('app_users')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) {
                        console.error('❌ USER FETCH ERROR:', error);
                        console.error('Error message:', error.message);
                        console.error('Error code:', error.code);
                        alert(`Database Error: ${error.message}\n\nCould not load users.`);
                        setUsers([]);
                    } else {
                        console.log('✅ Users fetched successfully:', data);
                        setUsers(data || []);
                    }
                } catch (error) {
                    console.error('💥 FETCH USERS FAILED:', error);
                    alert(`System Error: ${error.message}`);
                    setUsers([]);
                } finally {
                    setLoading(false);
                }
            };

            const updateUserRole = async (userId, newRole) => {
                try {
                    console.log('🔄 Updating user role:', userId, 'to', newRole);
                    
                    const { error } = await supabase
                        .from('app_users')
                        .update({ 
                            role: newRole,
                            updated_at: new Date().toISOString()
                        })

                        alert(`Database Error: ${error.message}\n\nCould not update user role.`);
                    } else {

                        const user = users.find(u => u.id === userId);

                        fetchUsers(); // Refresh the list

                    console.error('💥 UPDATE ROLE FAILED:', error);
                    alert(`System Error: ${error.message}`);
                }

            const toggleUserStatus = async (userId) => {
                try {
                    const user = users.find(u => u.id === userId);

                    console.log('🔄 Toggling user status:', userId, 'to', newStatus);
                    
                    const { error } = await supabase
                        .from('app_users')
                        .update({

                            updated_at: new Date().toISOString()
                        })

                        console.error('❌ STATUS TOGGLE ERROR:', error);
                        alert(`Database Error: ${error.message}\n\nCould not update user status.`);
                    } else {
                        console.log('✅ User status updated successfully');
                        alert(`${user.full_name} ${newStatus ? 'activated' : 'deactivated'}`);

                        .from('app_users')
                        .delete()
                        .eq('id', userId);

                    if (error) {
                        console.error('❌ DELETE USER ERROR:', error);
                        alert(`Database Error: ${error.message}\n\nCould not delete user.`);
                    } else {
                        console.log('✅ User deleted successfully');
                        alert(`${user.full_name} has been deleted`);

        function UserCard({ user, onUpdateRole, onToggleStatus, onDeleteUser }) {
            const [showReports, setShowReports] = useState(false);
            const [availableReports, setAvailableReports] = useState([]);
            const [userReportAccess, setUserReportAccess] = useState([]);
            const [loading, setLoading] = useState(false);

            // Fetch available reports and user's current access
            useEffect(() => {
                if (user.role === 'Viewer' && showReports) {
                    fetchReportsAndAccess();
                }
            }, [showReports, user.role]);

            const fetchReportsAndAccess = async () => {
                setLoading(true);
                try {
                    // Fetch all available reports
                    const { data: reports, error: reportsError } = await supabase
                        .from('procurement_reports')
                        .select('id, name')
                        .order('name');

                    if (reportsError) {
                        console.error('❌ Error fetching reports:', reportsError);
                        return;
                    }

                    // Fetch user's current report access
                    const { data: access, error: accessError } = await supabase
                        .from('user_report_permissions')
                        .select('report_id')
                        .eq('user_id', user.id);

                    if (accessError && accessError.code !== 'PGRST116') {
                        console.error('❌ Error fetching user access:', accessError);
                        return;
                    }

                    setAvailableReports(reports || []);
                    setUserReportAccess((access || []).map(a => a.report_id));
                } catch (error) {
                    console.error('💥 Error in fetchReportsAndAccess:', error);
                } finally {
                    setLoading(false);
                }
            };

            const toggleReportAccess = async (reportId) => {
                try {
                    const hasAccess = userReportAccess.includes(reportId);
                    
                    if (hasAccess) {
                        // Remove access
                        const { error } = await supabase
                            .from('user_report_permissions')
                            .delete()
                            .eq('user_id', user.id)
                            .eq('report_id', reportId);

                        if (error) {
                            console.error('❌ Error removing access:', error);
                            alert(`Error removing access: ${error.message}`);
                            return;
                        }

                        setUserReportAccess(prev => prev.filter(id => id !== reportId));
                    } else {
                        // Add access
                        const { error } = await supabase
                            .from('user_report_permissions')
                            .insert([{
                                user_id: user.id,
                                report_id: reportId,
                                granted_by: user.id, // This should be the current admin's ID in real implementation
                                granted_at: new Date().toISOString()
                            }]);

                        if (error) {
                            console.error('❌ Error adding access:', error);
                            alert(`Error adding access: ${error.message}`);
                            return;
                        }

                        setUserReportAccess(prev => [...prev, reportId]);
                    }
                } catch (error) {
                    console.error('💥 Error toggling report access:', error);
                    alert(`System error: ${error.message}`);
                }
            };

            return (
                <div className="bg-gray-50 p-4 rounded-lg border">
                    <div className="flex justify-between items-start mb-3">
                        <div>
                            <h4 className="font-medium text-lg">{user.full_name}</h4>
                            <p className="text-sm text-gray-600">{user.email}</p>
                            <p className="text-xs text-gray-500">
                                {user.auth_provider} • Created {new Date(user.created_at).toLocaleDateString()}
                                {user.updated_at && user.updated_at !== user.created_at && (
                                    <span> • Updated {new Date(user.updated_at).toLocaleDateString()}</span>
                                )}
                            </p>
                        </div>
                        <div className="flex items-center gap-3">
                            <select
                                value={user.role}
                                onChange={(e) => onUpdateRole(user.id, e.target.value)}
                                className="text-sm px-3 py-1 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="Admin">Admin</option>
                                <option value="Viewer">Viewer</option>
                            </select>
                            <button
                                onClick={() => onToggleStatus(user.id)}
                                className={`px-3 py-1 rounded-full text-xs font-medium ${
                                    user.is_active 
                                        ? 'bg-green-100 text-green-800 hover:bg-green-200' 
                                        : 'bg-red-100 text-red-800 hover:bg-red-200'
                                }`}
                            >
                                {user.is_active ? 'Active' : 'Inactive'}
                            </button>
                            <button
                                onClick={() => onDeleteUser(user.id)}
                                className="px-3 py-1 bg-red-100 text-red-800 hover:bg-red-200 rounded-full text-xs font-medium"
                                title="Delete User"
                            >
                                <i className="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    {user.role === 'Admin' && (
                        <div className="mt-2 text-sm text-gray-600">
                            <i className="fas fa-crown text-yellow-500 mr-1"></i>
                            Admin - Full access to all reports and user management
                        </div>
                    )}

                    {user.role === 'Viewer' && (
                        <div className="mt-3">
                            <button
                                onClick={() => setShowReports(!showReports)}
                                className="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center gap-2"
                            >
                                <i className={`fas fa-chevron-${showReports ? 'up' : 'down'}`}></i>
                                Report Access ({userReportAccess.length} reports)
                            </button>

                            {showReports && (
                                <div className="mt-3 p-3 bg-white rounded border">
                                    {loading ? (
                                        <div className="text-center py-4">
                                            <i className="fas fa-spinner fa-spin text-blue-500"></i>
                                            <p className="text-sm text-gray-500 mt-1">Loading reports...</p>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="text-sm font-medium text-gray-700 mb-2">
                                                Select accessible reports:
                                            </div>
                                            {availableReports.length === 0 ? (
                                                <p className="text-sm text-gray-500">No reports available yet.</p>
                                            ) : (
                                                <div className="space-y-2 max-h-40 overflow-y-auto">
                                                    {availableReports.map(report => (
                                                        <label key={report.id} className="flex items-center text-sm">
                                                            <input
                                                                type="checkbox"
                                                                checked={userReportAccess.includes(report.id)}
                                                                onChange={() => toggleReportAccess(report.id)}
                                                                className="mr-2 rounded text-blue-600 focus:ring-blue-500"
                                                            />
                                                            {report.name}
                                                        </label>
                                                    ))}
                                                </div>
                                            )}
                                            <div className="mt-2 text-xs text-gray-500">
                                                Selected: {userReportAccess.length} of {availableReports.length} reports
                                            </div>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

                            alert(`Error: A user with email "${formData.email}" already exists.`);
                        } else {
                            alert(`Database Error: ${error.message}\n\nCould not add user.`);
                        }
                    } else {
                        console.log('✅ User added successfully');
                        alert(`User "${formData.full_name}" added successfully!`);
                        onSuccess();
                    }
                } catch (error) {
                    console.error('💥 ADD USER FAILED:', error);
                    alert(`System Error: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-lg mx-4">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-semibold">Add New User</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Email *
                                </label>
                                <input
                                    type="email"
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.email}
                                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                                    placeholder="user@company.com"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Full Name *
                                </label>
                                <input
                                    type="text"
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.full_name}
                                    onChange={(e) => setFormData({...formData, full_name: e.target.value})}
                                    placeholder="John Doe"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Role *
                                </label>
                                <select
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.role}
                                    onChange={(e) => setFormData({...formData, role: e.target.value})}
                                >
                                    <option value="Viewer">Viewer - Read-only access</option>
                                    <option value="Admin">Admin - Full access</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Authentication Provider *
                                </label>
                                <select
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.auth_provider}
                                    onChange={(e) => setFormData({...formData, auth_provider: e.target.value})}
                                >
                                    <option value="manual">Manual - Added by admin</option>
                                    <option value="google">Google - OAuth login</option>
                                </select>
                            </div>

                            <div className="flex gap-3 pt-4">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg disabled:opacity-50"
                                >
                                    {loading ? (
                                        <>
                                            <i className="fas fa-spinner fa-spin mr-2"></i>
                                            Adding...
                                        </>
                                    ) : (
                                        <>
                                            <i className="fas fa-plus mr-2"></i>
                                            Add User
                                        </>
                                    )}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Reports Repository - Debug</title>
    <link rel="icon" href="data:,">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Replace with your actual Supabase credentials
        const supabaseUrl = 'https://nrgusitisxvocfqqbsvg.supabase.co';
        const supabaseKey = 'sb_publishable_2FMu-Nwrf12sBL9xuqPmSg_tXRW_nHq';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function App() {
            const [user, setUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [debugInfo, setDebugInfo] = useState({});

            useEffect(() => {
                // Collect debug information
                const debug = {
                    currentUrl: window.location.href,
                    origin: window.location.origin,
                    hostname: window.location.hostname,
                    protocol: window.location.protocol,
                    hash: window.location.hash,
                    search: window.location.search,
                    isNetlify: window.location.hostname.includes('netlify'),
                    userAgent: navigator.userAgent.substring(0, 100) + '...'
                };
                setDebugInfo(debug);
                
                console.log('=== DEBUG INFO ===');
                console.log('Current URL:', debug.currentUrl);
                console.log('Origin:', debug.origin);
                console.log('Is Netlify:', debug.isNetlify);
                console.log('Supabase URL configured:', supabaseUrl);
                console.log('==================');
                
                initializeAuth();
            }, []);

            const initializeAuth = async () => {
                try {
                    // Check for OAuth callback parameters
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    const searchParams = new URLSearchParams(window.location.search);
                    
                    console.log('Hash params:', Object.fromEntries(hashParams));
                    console.log('Search params:', Object.fromEntries(searchParams));

                    // Check active session
                    const { data: { session }, error } = await supabase.auth.getSession();
                    console.log('Session check result:', {
                        hasSession: !!session,
                        userEmail: session?.user?.email,
                        error: error?.message
                    });
                    
                    if (error) {
                        console.error('Session error:', error);
                        setAuthError(`Session error: ${error.message}`);
                        setLoading(false);
                        return;
                    }
                    
                    if (session?.user) {
                        console.log('✅ User authenticated via Google:', session.user.email);
                        setUser(session.user);
                        await fetchCurrentUser(session.user);
                    } else {
                        // Check for manual user
                        const manualUser = localStorage.getItem('manual_user');
                        if (manualUser) {
                            try {
                                const userData = JSON.parse(manualUser);
                                console.log('✅ Manual user found:', userData.email);
                                setCurrentUser(userData);
                            } catch (error) {
                                console.error('❌ Error parsing manual user:', error);
                                localStorage.removeItem('manual_user');
                            }
                        }
                        console.log('ℹ️ No authenticated user found');
                        setLoading(false);
                    }

                    // Listen for auth state changes
                    const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
                        console.log('🔄 Auth state change:', event, session?.user?.email || 'no user');
                        
                        if (event === 'SIGNED_IN') {
                            setUser(session?.user ?? null);
                            if (session?.user) {
                                await fetchCurrentUser(session.user);
                            }
                            // Clean URL after OAuth success
                            if (window.location.hash && window.location.hash.includes('access_token')) {
                                console.log('🧹 Cleaning OAuth parameters from URL');
                                window.history.replaceState({}, document.title, window.location.pathname);
                            }
                        } else if (event === 'SIGNED_OUT') {
                            setUser(null);
                            setCurrentUser(null);
                            localStorage.removeItem('manual_user');
                            setLoading(false);
                        }
                    });

                } catch (error) {
                    console.error('❌ Auth initialization error:', error);
                    setAuthError(`Authentication initialization failed: ${error.message}`);
                    setLoading(false);
                }
            };

            const fetchCurrentUser = async (authUser) => {
                try {
                    console.log('👤 Fetching user profile for:', authUser.email);
                    
                    const { data, error } = await supabase
                        .from('app_users')
                        .select('*')
                        .or(`auth_user_id.eq.${authUser.id},email.eq.${authUser.email}`)
                        .eq('is_active', true)
                        .single();

                    if (error) {
                        console.error('❌ User profile error:', error);
                        if (error.code === 'PGRST116') {
                            console.log('⏳ New user - waiting for profile creation...');
                            setTimeout(() => fetchCurrentUser(authUser), 3000);
                            return;
                        }
                        setAuthError(`User profile not found: ${error.message}. Please contact admin.`);
                    } else {
                        console.log('✅ User profile loaded:', data.full_name, `(${data.role})`);
                        setCurrentUser(data);
                        setAuthError(null);
                    }
                } catch (error) {
                    console.error('❌ Profile fetch error:', error);
                    setAuthError(`Error loading profile: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const signInWithGoogle = async () => {
                try {
                    setAuthError(null);
                    console.log('🔑 Starting Google OAuth...');
                    console.log('📍 Redirect URL will be:', window.location.origin);
                    
                    // Double-check we're not on localhost
                    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        setAuthError('❌ You are running on localhost. Please deploy to Netlify first!');
                        return;
                    }
                    
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin,
                            queryParams: {
                                access_type: 'offline',
                                prompt: 'consent',
                            },
                        }
                    });
                    
                    if (error) {
                        console.error('❌ Google OAuth error:', error);
                        setAuthError(`Google sign in failed: ${error.message}`);
                        return;
                    }
                    
                    console.log('✅ Google OAuth initiated successfully');
                    console.log('🔄 Redirecting to Google...');
                    
                } catch (error) {
                    console.error('❌ OAuth setup error:', error);
                    setAuthError(`OAuth setup error: ${error.message}`);
                }
            };

            const signOut = async () => {
                try {
                    console.log('👋 Signing out...');
                    const { error } = await supabase.auth.signOut();
                    if (error) throw error;
                    localStorage.removeItem('manual_user');
                    console.log('✅ Signed out successfully');
                } catch (error) {
                    console.error('❌ Sign out error:', error);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center max-w-md">
                            <i className="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                            <p className="text-gray-600 mb-4">Loading authentication...</p>
                            <div className="text-xs text-gray-500 space-y-1">
                                <p>URL: {debugInfo.currentUrl}</p>
                                <p>Environment: {debugInfo.isNetlify ? '✅ Netlify' : '❌ Not Netlify'}</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (!user && !currentUser) {
                return (
                    <LoginScreen 
                        onGoogleSignIn={signInWithGoogle} 
                        authError={authError}
                        onClearError={() => setAuthError(null)}
                        debugInfo={debugInfo}
                    />
                );
            }

            return <Dashboard user={currentUser} onSignOut={signOut} />;
        }

        function LoginScreen({ onGoogleSignIn, authError, onClearError, debugInfo }) {
            const [showManualLogin, setShowManualLogin] = useState(false);
            const [loginForm, setLoginForm] = useState({ email: '', password: '' });
            const [loading, setLoading] = useState(false);
            const [showDebugInfo, setShowDebugInfo] = useState(false);

            const handleManualLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                onClearError();

                try {
                    const { data, error } = await supabase
                        .from('app_users')
                        .select('*')
                        .eq('email', loginForm.email)
                        .eq('auth_provider', 'manual')
                        .eq('is_active', true)
                        .single();

                    if (error || !data || data.password_hash !== loginForm.password) {
                        throw new Error('Invalid credentials');
                    }

                    localStorage.setItem('manual_user', JSON.stringify(data));
                    window.location.reload();
                } catch (error) {
                    alert('Invalid credentials');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div className="max-w-md w-full mx-4">
                        <div className="bg-white rounded-lg shadow-lg p-8">
                            <div className="text-center mb-8">
                                <i className="fas fa-file-alt text-5xl text-blue-600 mb-4"></i>
                                <h1 className="text-2xl font-bold text-gray-900">Procurement Reports</h1>
                                <p className="text-gray-600">Repository Access</p>
                            </div>

                            {/* Environment Status */}
                            <div className={`mb-4 p-3 rounded-lg text-sm ${
                                debugInfo.isNetlify ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-yellow-50 text-yellow-700 border border-yellow-200'
                            }`}>
                                <div className="flex items-center">
                                    <i className={`fas ${debugInfo.isNetlify ? 'fa-check-circle' : 'fa-exclamation-triangle'} mr-2`}></i>
                                    <span>
                                        {debugInfo.isNetlify ? '✅ Running on Netlify' : '⚠️ Not running on Netlify'}
                                    </span>
                                </div>
                                <div className="text-xs mt-1">
                                    {debugInfo.hostname}
                                </div>
                            </div>

                            {authError && (
                                <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                    <div className="flex">
                                        <i className="fas fa-exclamation-circle text-red-400 mr-2 mt-0.5"></i>
                                        <div className="text-sm text-red-700 flex-1">
                                            {authError}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {!showManualLogin ? (
                                <div className="space-y-4">
                                    <button
                                        onClick={onGoogleSignIn}
                                        disabled={loading}
                                        className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors disabled:opacity-50"
                                    >
                                        <svg className="w-5 h-5" viewBox="0 0 24 24">
                                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                        </svg>
                                        Sign in with Google
                                    </button>

                                    <div className="text-center">
                                        <span className="text-gray-500">or</span>
                                    </div>

                                    <button
                                        onClick={() => setShowManualLogin(true)}
                                        className="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-3 rounded-lg transition-colors"
                                    >
                                        Sign in with Email
                                    </button>
                                </div>
                            ) : (
                                <form onSubmit={handleManualLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                        <input
                                            type="email"
                                            required
                                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            value={loginForm.email}
                                            onChange={(e) => setLoginForm({...loginForm, email: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                        <input
                                            type="password"
                                            required
                                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            value={loginForm.password}
                                            onChange={(e) => setLoginForm({...loginForm, password: e.target.value})}
                                        />
                                    </div>
                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg disabled:opacity-50"
                                    >
                                        {loading ? 'Signing in...' : 'Sign In'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setShowManualLogin(false)}
                                        className="w-full text-gray-600 hover:text-gray-800"
                                    >
                                        Back to Google Sign In
                                    </button>
                                </form>
                            )}

                            <div className="mt-6 pt-4 border-t border-gray-200">
                                <button
                                    onClick={() => setShowDebugInfo(!showDebugInfo)}
                                    className="text-xs text-gray-500 hover:text-gray-700"
                                >
                                    {showDebugInfo ? 'Hide' : 'Show'} Debug Info
                                </button>
                                
                                {showDebugInfo && (
                                    <div className="mt-2 p-3 bg-gray-50 rounded text-xs font-mono space-y-1">
                                        <div><strong>URL:</strong> {debugInfo.currentUrl}</div>
                                        <div><strong>Origin:</strong> {debugInfo.origin}</div>
                                        <div><strong>Protocol:</strong> {debugInfo.protocol}</div>
                                        <div><strong>Is Netlify:</strong> {debugInfo.isNetlify ? 'Yes' : 'No'}</div>
                                        <div><strong>Hash:</strong> {debugInfo.hash || 'none'}</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ user, onSignOut }) {
            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div className="bg-white rounded-lg shadow-lg p-8 text-center max-w-md">
                        <i className="fas fa-check-circle text-6xl text-green-500 mb-4"></i>
                        <h1 className="text-2xl font-bold text-gray-900 mb-2">Welcome!</h1>
                        <p className="text-gray-600 mb-2">{user.full_name}</p>
                        <p className="text-sm text-gray-500 mb-6">Role: {user.role}</p>
                        <button
                            onClick={onSignOut}
                            className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg"
                        >
                            Sign Out
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

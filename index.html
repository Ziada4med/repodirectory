<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Reports Repository</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'><path d='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'/></svg>">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Your Supabase configuration
        const supabaseUrl = 'https://nrgusitisxvocfqqbsvg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yZ3VzaXRpc3h2b2NmcXFic3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyODU3MTcsImV4cCI6MjA4NTg2MTcxN30.Ped9Cf8wCsighV5cmFETWdF_7ruktTj1CeJfo-0q8mw';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function App() {
            const [user, setUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [debugInfo, setDebugInfo] = useState([]);

            const addDebugInfo = (message, type = 'info') => {
                const timestamp = new Date().toLocaleTimeString();
                const entry = `[${timestamp}] ${message}`;
                console.log(entry);
                setDebugInfo(prev => [...prev.slice(-20), { message: entry, type }]);
            };

            useEffect(() => {
                addDebugInfo('🚀 App starting...');
                addDebugInfo(`📍 Current URL: ${window.location.href}`);
                addDebugInfo(`🌐 Origin: ${window.location.origin}`);
                addDebugInfo(`🔧 Supabase URL: ${supabaseUrl}`);
                
                // Detailed URL analysis
                const urlParams = {
                    hash: window.location.hash,
                    search: window.location.search,
                    pathname: window.location.pathname,
                    hostname: window.location.hostname
                };
                
                addDebugInfo(`🔍 URL Analysis: ${JSON.stringify(urlParams)}`);
                
                // Check for OAuth callback indicators
                if (urlParams.hash.includes('access_token')) {
                    addDebugInfo('✅ OAuth access_token found in URL hash', 'success');
                } else if (urlParams.hash.includes('error')) {
                    addDebugInfo(`❌ OAuth error found in URL: ${urlParams.hash}`, 'error');
                } else if (urlParams.search.includes('code=')) {
                    addDebugInfo('✅ OAuth authorization code found in URL', 'success');
                } else if (urlParams.search.includes('error=')) {
                    addDebugInfo(`❌ OAuth error in search params: ${urlParams.search}`, 'error');
                } else {
                    addDebugInfo('ℹ️ No OAuth callback parameters detected');
                }

                initializeAuth();
            }, []);

            const initializeAuth = async () => {
                try {
                    addDebugInfo('🔐 Testing Supabase connection...');

                    // Test basic connectivity
                    const { data: { session }, error } = await supabase.auth.getSession();
                    
                    if (error) {
                        addDebugInfo(`❌ Supabase auth error: ${error.message}`, 'error');
                        setAuthError(`Authentication service error: ${error.message}`);
                        setLoading(false);
                        return;
                    }
                    
                    addDebugInfo('✅ Supabase connection successful');
                    
                    if (session?.user) {
                        addDebugInfo(`✅ Active session found: ${session.user.email}`);
                        addDebugInfo(`📧 User ID: ${session.user.id}`);
                        addDebugInfo(`🔑 Auth provider: ${session.user.app_metadata?.provider || 'unknown'}`);
                        
                        setUser(session.user);
                        await fetchCurrentUser(session.user);
                    } else {
                        addDebugInfo('ℹ️ No active session');
                        // Check for manual user
                        const manualUser = localStorage.getItem('manual_user');
                        if (manualUser) {
                            try {
                                const userData = JSON.parse(manualUser);
                                addDebugInfo(`✅ Manual user from localStorage: ${userData.email}`);
                                setCurrentUser(userData);
                            } catch (error) {
                                addDebugInfo(`❌ Invalid manual user data: ${error.message}`, 'error');
                                localStorage.removeItem('manual_user');
                            }
                        }
                        setLoading(false);
                    }

                    // Set up auth state change listener
                    const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
                        addDebugInfo(`🔄 Auth state change: ${event}`);
                        
                        if (session?.user) {
                            addDebugInfo(`👤 User in session: ${session.user.email}`);
                        }
                        
                        switch (event) {
                            case 'SIGNED_IN':
                                addDebugInfo(`✅ User signed in: ${session?.user?.email}`);
                                setUser(session?.user ?? null);
                                setAuthError(null);
                                if (session?.user) {
                                    await fetchCurrentUser(session.user);
                                }
                                // Clean URL after successful OAuth
                                if (window.location.hash || window.location.search.includes('code=')) {
                                    addDebugInfo('🧹 Cleaning OAuth parameters from URL');
                                    window.history.replaceState({}, document.title, window.location.pathname);
                                }
                                break;
                                
                            case 'SIGNED_OUT':
                                addDebugInfo('👋 User signed out');
                                setUser(null);
                                setCurrentUser(null);
                                localStorage.removeItem('manual_user');
                                setLoading(false);
                                break;
                                
                            case 'TOKEN_REFRESHED':
                                addDebugInfo('🔄 Auth token refreshed');
                                break;
                                
                            default:
                                addDebugInfo(`🔄 Auth event: ${event}`);
                        }
                    });

                } catch (error) {
                    addDebugInfo(`❌ Auth initialization failed: ${error.message}`, 'error');
                    setAuthError(`Failed to initialize authentication: ${error.message}`);
                    setLoading(false);
                }
            };

            const fetchCurrentUser = async (authUser) => {
                try {
                    addDebugInfo(`👤 Looking up user profile for: ${authUser.email}`);
                    
                    const { data, error } = await supabase
                        .from('app_users')
                        .select('*')
                        .or(`auth_user_id.eq.${authUser.id},email.eq.${authUser.email}`)
                        .eq('is_active', true)
                        .single();

                    if (error) {
                        addDebugInfo(`❌ User profile query error: ${error.code} - ${error.message}`, 'error');
                        
                        if (error.code === 'PGRST116') {
                            addDebugInfo('⏳ User profile not found - might be new user', 'warning');
                            addDebugInfo('Waiting for user profile to be created by database trigger...');
                            
                            // Wait and retry
                            setTimeout(() => fetchCurrentUser(authUser), 3000);
                            return;
                        }
                        
                        setAuthError(`User profile not found in database. Error: ${error.message}. Please contact your administrator.`);
                    } else {
                        addDebugInfo(`✅ User profile found: ${data.full_name} (${data.role})`);
                        addDebugInfo(`📧 Profile email: ${data.email}`);
                        addDebugInfo(`🔐 Auth provider: ${data.auth_provider}`);
                        
                        setCurrentUser(data);
                        setAuthError(null);
                    }
                } catch (error) {
                    addDebugInfo(`❌ Profile fetch exception: ${error.message}`, 'error');
                    setAuthError(`Error loading user profile: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const signInWithGoogle = async () => {
                try {
                    setAuthError(null);
                    addDebugInfo('🔑 Initiating Google OAuth...');
                    
                    const currentOrigin = window.location.origin;
                    addDebugInfo(`📍 Current origin: ${currentOrigin}`);
                    addDebugInfo(`🔄 OAuth redirect will be: ${currentOrigin}`);
                    
                    // Validate we're not on localhost
                    if (currentOrigin.includes('localhost') || currentOrigin.includes('127.0.0.1')) {
                        const error = 'Still running on localhost! Please use https://repodirectory.netlify.app';
                        addDebugInfo(`❌ ${error}`, 'error');
                        setAuthError(error);
                        return;
                    }

                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: currentOrigin,
                            queryParams: {
                                access_type: 'offline',
                                prompt: 'consent',
                            },
                        }
                    });
                    
                    if (error) {
                        addDebugInfo(`❌ OAuth request failed: ${error.message}`, 'error');
                        setAuthError(`Google OAuth failed: ${error.message}`);
                        return;
                    }
                    
                    addDebugInfo('✅ OAuth request sent - redirecting to Google...');
                    addDebugInfo('🔄 If you see localhost error, check Google Cloud Console settings');
                    
                } catch (error) {
                    addDebugInfo(`❌ OAuth exception: ${error.message}`, 'error');
                    setAuthError(`OAuth setup error: ${error.message}`);
                }
            };

            const signOut = async () => {
                try {
                    addDebugInfo('👋 Initiating sign out...');
                    const { error } = await supabase.auth.signOut();
                    if (error) throw error;
                    localStorage.removeItem('manual_user');
                    addDebugInfo('✅ Sign out successful');
                } catch (error) {
                    addDebugInfo(`❌ Sign out error: ${error.message}`, 'error');
                }
            };

            if (loading) {
                return <LoadingScreen debugInfo={debugInfo} />;
            }

            if (!user && !currentUser) {
                return (
                    <LoginScreen 
                        onGoogleSignIn={signInWithGoogle} 
                        authError={authError}
                        onClearError={() => setAuthError(null)}
                        debugInfo={debugInfo}
                    />
                );
            }

            return <Dashboard user={currentUser} onSignOut={signOut} debugInfo={debugInfo} />;
        }

        function LoadingScreen({ debugInfo }) {
            const [showDebug, setShowDebug] = useState(false);

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="text-center max-w-3xl w-full">
                        <i className="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                        <p className="text-gray-600 mb-6">Loading authentication system...</p>
                        
                        <button
                            onClick={() => setShowDebug(!showDebug)}
                            className="text-sm text-blue-600 hover:text-blue-800 mb-4"
                        >
                            {showDebug ? 'Hide' : 'Show'} Initialization Log
                        </button>

                        {showDebug && (
                            <div className="bg-gray-900 text-left p-4 rounded-lg text-xs font-mono max-h-96 overflow-y-auto">
                                {debugInfo.map((item, index) => (
                                    <div key={index} className={`mb-1 ${
                                        item.type === 'error' ? 'text-red-400' : 
                                        item.type === 'warning' ? 'text-yellow-400' : 
                                        item.type === 'success' ? 'text-green-400' :
                                        'text-gray-300'
                                    }`}>
                                        {item.message}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function LoginScreen({ onGoogleSignIn, authError, onClearError, debugInfo }) {
            const [showDebug, setShowDebug] = useState(false);
            const [showManualLogin, setShowManualLogin] = useState(false);

            const isNetlify = window.location.hostname === 'repodirectory.netlify.app';

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                    <div className="max-w-lg w-full">
                        <div className="bg-white rounded-lg shadow-lg p-8">
                            <div className="text-center mb-8">
                                <i className="fas fa-file-alt text-5xl text-blue-600 mb-4"></i>
                                <h1 className="text-2xl font-bold text-gray-900">Procurement Reports</h1>
                                <p className="text-gray-600">Repository Access</p>
                            </div>

                            {/* Environment Status */}
                            <div className={`mb-6 p-4 rounded-lg border ${
                                isNetlify ? 'bg-green-50 border-green-200' : 'bg-yellow-50 border-yellow-200'
                            }`}>
                                <div className="flex items-center mb-2">
                                    <i className={`fas ${isNetlify ? 'fa-check-circle text-green-600' : 'fa-exclamation-triangle text-yellow-600'} mr-2`}></i>
                                    <span className={`font-medium ${isNetlify ? 'text-green-800' : 'text-yellow-800'}`}>
                                        {isNetlify ? 'Environment: Production (Netlify)' : 'Environment: Development'}
                                    </span>
                                </div>
                                <div className="text-sm text-gray-600">
                                    <div>URL: {window.location.href}</div>
                                    <div>Domain: {window.location.hostname}</div>
                                </div>
                            </div>

                            {authError && (
                                <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                    <div className="flex">
                                        <i className="fas fa-exclamation-circle text-red-400 mr-2 mt-0.5"></i>
                                        <div className="text-sm text-red-700 flex-1">
                                            <div className="font-medium mb-1">Authentication Error:</div>
                                            <div>{authError}</div>
                                        </div>
                                    </div>
                                    <button
                                        onClick={onClearError}
                                        className="text-xs text-red-600 hover:text-red-800 mt-2"
                                    >
                                        Dismiss
                                    </button>
                                </div>
                            )}

                            {!showManualLogin ? (
                                <div className="space-y-4">
                                    <button
                                        onClick={onGoogleSignIn}
                                        className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors"
                                    >
                                        <svg className="w-5 h-5" viewBox="0 0 24 24">
                                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                        </svg>
                                        Sign in with Google
                                    </button>

                                    <div className="text-center">
                                        <span className="text-gray-500">or</span>
                                    </div>

                                    <button
                                        onClick={() => setShowManualLogin(true)}
                                        className="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-3 rounded-lg transition-colors"
                                    >
                                        Sign in with Email
                                    </button>
                                </div>
                            ) : (
                                <ManualLoginForm onBack={() => setShowManualLogin(false)} />
                            )}

                            <div className="mt-6 pt-4 border-t border-gray-200">
                                <button
                                    onClick={() => setShowDebug(!showDebug)}
                                    className="text-xs text-gray-500 hover:text-gray-700"
                                >
                                    {showDebug ? 'Hide' : 'Show'} Technical Debug Log
                                </button>
                                
                                {showDebug && (
                                    <div className="mt-3 p-3 bg-gray-900 text-green-400 rounded text-xs font-mono max-h-64 overflow-y-auto">
                                        {debugInfo.map((item, index) => (
                                            <div key={index} className={`mb-1 ${
                                                item.type === 'error' ? 'text-red-400' : 
                                                item.type === 'warning' ? 'text-yellow-400' : 
                                                item.type === 'success' ? 'text-green-400' :
                                                'text-gray-300'
                                            }`}>
                                                {item.message}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ManualLoginForm({ onBack }) {
            const [formData, setFormData] = useState({ email: '', password: '' });
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    const { data, error } = await supabase
                        .from('app_users')
                        .select('*')
                        .eq('email', formData.email)
                        .eq('auth_provider', 'manual')
                        .eq('is_active', true)
                        .single();

                    if (error || !data || data.password_hash !== formData.password) {
                        throw new Error('Invalid credentials');
                    }

                    localStorage.setItem('manual_user', JSON.stringify(data));
                    window.location.reload();
                } catch (error) {
                    alert('Invalid credentials');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-4">
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input
                            type="email"
                            required
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            value={formData.email}
                            onChange={(e) => setFormData({...formData, email: e.target.value})}
                        />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input
                            type="password"
                            required
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            value={formData.password}
                            onChange={(e) => setFormData({...formData, password: e.target.value})}
                        />
                    </div>
                    <button
                        type="submit"
                        disabled={loading}
                        className="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg disabled:opacity-50"
                    >
                        {loading ? 'Signing in...' : 'Sign In'}
                    </button>
                    <button
                        type="button"
                        onClick={onBack}
                        className="w-full text-gray-600 hover:text-gray-800"
                    >
                        Back to Google Sign In
                    </button>
                </form>
            );
        }

        function Dashboard({ user, onSignOut, debugInfo }) {
            const [showDebug, setShowDebug] = useState(false);

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-lg shadow-lg p-8 text-center max-w-md w-full">
                        <i className="fas fa-check-circle text-6xl text-green-500 mb-4"></i>
                        <h1 className="text-2xl font-bold text-gray-900 mb-2">Welcome!</h1>
                        <p className="text-lg text-gray-600 mb-2">{user.full_name}</p>
                        <p className="text-sm text-gray-500 mb-6">
                            Role: {user.role} • Provider: {user.auth_provider}
                        </p>
                        
                        <div className="space-y-3 mb-6">
                            <div className="text-sm text-green-600 bg-green-50 p-3 rounded">
                                ✅ Authentication successful!
                            </div>
                            <div className="text-xs text-gray-500">
                                Your procurement reports dashboard would be implemented here.
                            </div>
                        </div>

                        <button
                            onClick={onSignOut}
                            className="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg mb-4"
                        >
                            Sign Out
                        </button>

                        <div className="pt-4 border-t">
                            <button
                                onClick={() => setShowDebug(!showDebug)}
                                className="text-xs text-gray-500 hover:text-gray-700"
                            >
                                {showDebug ? 'Hide' : 'Show'} Session Debug
                            </button>
                            
                            {showDebug && (
                                <div className="mt-3 p-3 bg-gray-900 text-green-400 rounded text-xs font-mono max-h-32 overflow-y-auto text-left">
                                    {debugInfo.slice(-10).map((item, index) => (
                                        <div key={index} className={`mb-1 ${
                                            item.type === 'error' ? 'text-red-400' : 
                                            item.type === 'success' ? 'text-green-400' :
                                            'text-gray-300'
                                        }`}>
                                            {item.message}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

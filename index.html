<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Reports Repository</title>
    <!-- Fix for favicon error -->
    <link rel="icon" href="data:,">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Replace with your actual values
        const supabaseUrl = 'https://nrgusitisxvocfqqbsvg.supabase.co';
        const supabaseKey = 'sb_publishable_2FMu-Nwrf12sBL9xuqPmSg_tXRW_nHq';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function App() {
            const [user, setUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showLogin, setShowLogin] = useState(false);
            const [authError, setAuthError] = useState(null);

            useEffect(() => {
                console.log('Initializing auth...');
                
                // Check active session
                supabase.auth.getSession().then(({ data: { session }, error }) => {
                    console.log('Session check:', { session, error });
                    
                    if (error) {
                        console.error('Session error:', error);
                        setAuthError(error.message);
                        setLoading(false);
                        return;
                    }
                    
                    setUser(session?.user ?? null);
                    if (session?.user) {
                        console.log('User found in session:', session.user.email);
                        fetchCurrentUser(session.user);
                    } else {
                        setLoading(false);
                    }
                });

                // Listen for auth changes
                const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
                    console.log('Auth state changed:', event, session?.user?.email);
                    
                    if (event === 'SIGNED_IN') {
                        setUser(session?.user ?? null);
                        if (session?.user) {
                            fetchCurrentUser(session.user);
                        }
                    } else if (event === 'SIGNED_OUT') {
                        setUser(null);
                        setCurrentUser(null);
                        setLoading(false);
                    }
                });

                return () => subscription.unsubscribe();
            }, []);

            const fetchCurrentUser = async (authUser) => {
                try {
                    console.log('Fetching user data for:', authUser.email);
                    
                    const { data, error } = await supabase
                        .from('app_users')
                        .select('*')
                        .or(`auth_user_id.eq.${authUser.id},email.eq.${authUser.email}`)
                        .eq('is_active', true)
                        .single();

                    if (error) {
                        console.error('Error fetching user:', error);
                        if (error.code === 'PGRST116') {
                            // No user found, they might be new
                            console.log('New user detected, waiting for trigger to create profile...');
                            setTimeout(() => fetchCurrentUser(authUser), 2000);
                            return;
                        }
                        setAuthError('User not found in system. Please contact administrator.');
                        setShowLogin(true);
                    } else {
                        console.log('User profile found:', data);
                        setCurrentUser(data);
                        setAuthError(null);
                    }
                } catch (error) {
                    console.error('Error fetching current user:', error);
                    setAuthError('Error loading user profile');
                } finally {
                    setLoading(false);
                }
            };

            const signInWithGoogle = async () => {
                try {
                    setAuthError(null);
                    console.log('Initiating Google sign in...');
                    
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin,
                            queryParams: {
                                access_type: 'offline',
                                prompt: 'consent',
                            },
                        }
                    });
                    
                    if (error) {
                        console.error('Google sign in error:', error);
                        throw error;
                    }
                    
                    console.log('Google sign in initiated:', data);
                } catch (error) {
                    console.error('Error signing in with Google:', error);
                    setAuthError(`Google sign in failed: ${error.message}`);
                }
            };

            const signOut = async () => {
                try {
                    console.log('Signing out...');
                    const { error } = await supabase.auth.signOut();
                    if (error) throw error;
                    
                    // Clear any manual user data
                    localStorage.removeItem('manual_user');
                } catch (error) {
                    console.error('Error signing out:', error);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <i className="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                            <p className="text-gray-600">Loading...</p>
                        </div>
                    </div>
                );
            }

            if (!user || !currentUser || showLogin) {
                return (
                    <LoginScreen 
                        onGoogleSignIn={signInWithGoogle} 
                        authError={authError}
                        onClearError={() => setAuthError(null)}
                    />
                );
            }

            return <Dashboard user={currentUser} onSignOut={signOut} />;
        }

        function LoginScreen({ onGoogleSignIn, authError, onClearError }) {
            const [showManualLogin, setShowManualLogin] = useState(false);
            const [loginForm, setLoginForm] = useState({ email: '', password: '' });
            const [loading, setLoading] = useState(false);

            const handleManualLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                onClearError();

                try {
                    console.log('Attempting manual login for:', loginForm.email);
                    
                    const { data, error } = await supabase
                        .from('app_users')
                        .select('*')
                        .eq('email', loginForm.email)
                        .eq('auth_provider', 'manual')
                        .eq('is_active', true)
                        .single();

                    if (error || !data) {
                        throw new Error('Invalid credentials');
                    }

                    // Simple password check (in production, use proper hashing)
                    if (data.password_hash !== loginForm.password) {
                        throw new Error('Invalid credentials');
                    }

                    console.log('Manual login successful for:', data.email);
                    localStorage.setItem('manual_user', JSON.stringify(data));
                    window.location.reload();
                } catch (error) {
                    console.error('Manual login error:', error);
                    onClearError();
                    setTimeout(() => {
                        alert('Invalid credentials');
                    }, 100);
                } finally {
                    setLoading(false);
                }
            };

            // Check for manual user on component mount
            useEffect(() => {
                const manualUser = localStorage.getItem('manual_user');
                if (manualUser) {
                    try {
                        const userData = JSON.parse(manualUser);
                        console.log('Found manual user in localStorage:', userData.email);
                        // This should trigger a re-render in the parent component
                        window.location.reload();
                    } catch (error) {
                        console.error('Error parsing manual user data:', error);
                        localStorage.removeItem('manual_user');
                    }
                }
            }, []);

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div className="max-w-md w-full mx-4">
                        <div className="bg-white rounded-lg shadow-lg p-8">
                            <div className="text-center mb-8">
                                <i className="fas fa-file-alt text-5xl text-blue-600 mb-4"></i>
                                <h1 className="text-2xl font-bold text-gray-900">Procurement Reports</h1>
                                <p className="text-gray-600">Repository Access</p>
                            </div>

                            {authError && (
                                <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
                                    <div className="flex">
                                        <i className="fas fa-exclamation-circle text-red-400 mr-2 mt-0.5"></i>
                                        <div className="text-sm text-red-700">
                                            {authError}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {!showManualLogin ? (
                                <div className="space-y-4">
                                    <button
                                        onClick={onGoogleSignIn}
                                        disabled={loading}
                                        className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors disabled:opacity-50"
                                    >
                                        <svg className="w-5 h-5" viewBox="0 0 24 24">
                                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                        </svg>
                                        {loading ? 'Connecting...' : 'Sign in with Google'}
                                    </button>

                                    <div className="text-center">
                                        <span className="text-gray-500">or</span>
                                    </div>

                                    <button
                                        onClick={() => setShowManualLogin(true)}
                                        className="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-3 rounded-lg transition-colors"
                                    >
                                        Sign in with Email
                                    </button>
                                </div>
                            ) : (
                                <form onSubmit={handleManualLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Email
                                        </label>
                                        <input
                                            type="email"
                                            required
                                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            value={loginForm.email}
                                            onChange={(e) => setLoginForm({...loginForm, email: e.target.value})}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Password
                                        </label>
                                        <input
                                            type="password"
                                            required
                                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            value={loginForm.password}
                                            onChange={(e) => setLoginForm({...loginForm, password: e.target.value})}
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg disabled:opacity-50"
                                    >
                                        {loading ? 'Signing in...' : 'Sign In'}
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setShowManualLogin(false)}
                                        className="w-full text-gray-600 hover:text-gray-800"
                                    >
                                        Back to Google Sign In
                                    </button>
                                </form>
                            )}

                            <div className="mt-6 text-center text-xs text-gray-500">
                                Debug info: Check browser console for detailed logs
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ... rest of your components remain the same ...
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

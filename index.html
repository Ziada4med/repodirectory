<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Reports Repository</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'><path d='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'/></svg>">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://nrgusitisxvocfqqbsvg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yZ3VzaXRpc3h2b2NmcXFic3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyODU3MTcsImV4cCI6MjA4NTg2MTcxN30.Ped9Cf8wCsighV5cmFlETWdF_7ruktTj1CeJfo-0q8mw';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function App() {
            const [user, setUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);

            useEffect(() => {
                // Check for OAuth callback first
                console.log('Current URL:', window.location.href);
                console.log('Hash:', window.location.hash);
                console.log('Search:', window.location.search);
                
                // Clear the error parameters immediately to prevent Supabase from failing
                if (window.location.search.includes('error=server_error') || window.location.hash.includes('error=server_error')) {
                    console.log('Clearing database error parameters...');
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
                
                // Give Supabase time to process any valid OAuth tokens
                setTimeout(() => {
                    initializeAuth();
                }, 500);
            }, []);

            const initializeAuth = async () => {
                try {
                    console.log('Getting session...');
                    const { data: { session }, error } = await supabase.auth.getSession();
                    console.log('Session result:', session?.user?.email, error?.message);
                    
                    if (session?.user) {
                        console.log('Found existing session, creating temp user...');
                        setUser(session.user);
                        // Skip database lookup completely
                        const tempUser = {
                            id: session.user.id,
                            email: session.user.email,
                            full_name: session.user.user_metadata?.full_name || session.user.user_metadata?.name || session.user.email,
                            role: 'Admin',
                            auth_provider: 'google',
                            auth_user_id: session.user.id,
                            is_active: true
                        };
                        setCurrentUser(tempUser);
                        setAuthError(null);
                        console.log('Temp user created:', tempUser);
                    } else {
                        console.log('No session found');
                        const manualUser = localStorage.getItem('manual_user');
                        if (manualUser) {
                            try {
                                const userData = JSON.parse(manualUser);
                                setCurrentUser(userData);
                            } catch (error) {
                                localStorage.removeItem('manual_user');
                            }
                        }
                    }
                    setLoading(false);

                    const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
                        console.log('Auth state change:', event, session?.user?.email);
                        
                        if (event === 'SIGNED_IN' && session?.user) {
                            console.log('User signed in successfully:', session.user.email);
                            setUser(session.user);
                            const tempUser = {
                                id: session.user.id,
                                email: session.user.email,
                                full_name: session.user.user_metadata?.full_name || session.user.user_metadata?.name || session.user.email,
                                role: 'Admin',
                                auth_provider: 'google',
                                auth_user_id: session.user.id,
                                is_active: true
                            };
                            setCurrentUser(tempUser);
                            setAuthError(null);
                            
                            // Clear URL after successful login
                            setTimeout(() => {
                                window.history.replaceState({}, document.title, window.location.pathname);
                            }, 1000);
                        } else if (event === 'SIGNED_OUT') {
                            console.log('User signed out');
                            setUser(null);
                            setCurrentUser(null);
                            localStorage.removeItem('manual_user');
                        }
                    });

                } catch (error) {
                    console.error('Auth error:', error);
                    setLoading(false);
                }
            };

            const signInWithGoogle = async () => {
                try {
                    setAuthError(null);
                    console.log('Starting Google OAuth...');
                    
                    // First, let's try to disable the automatic user creation by using a different approach
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: 'https://repodirectory.netlify.app',
                            queryParams: {
                                access_type: 'offline',
                                prompt: 'consent'
                            }
                        }
                    });
                    
                    if (error) {
                        console.error('OAuth error:', error);
                        setAuthError(`Google OAuth failed: ${error.message}`);
                    } else {
                        console.log('OAuth initiated successfully');
                    }
                } catch (error) {
                    console.error('OAuth setup error:', error);
                    setAuthError(`OAuth setup error: ${error.message}`);
                }
            };

            const signOut = async () => {
                try {
                    await supabase.auth.signOut();
                    localStorage.removeItem('manual_user');
                } catch (error) {
                    console.error('Sign out error:', error);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <i className="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                            <p className="text-gray-600">Loading...</p>
                        </div>
                    </div>
                );
            }

            if (!user && !currentUser) {
                return (
                    <LoginScreen 
                        onGoogleSignIn={signInWithGoogle} 
                        authError={authError}
                        onClearError={() => setAuthError(null)}
                    />
                );
            }

            return <Dashboard user={currentUser} onSignOut={signOut} />;
        }

        function LoginScreen({ onGoogleSignIn, authError, onClearError }) {
            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div className="max-w-md w-full mx-4">
                        <div className="bg-white rounded-lg shadow-lg p-8">
                            <div className="text-center mb-8">
                                <i className="fas fa-file-alt text-5xl text-blue-600 mb-4"></i>
                                <h1 className="text-2xl font-bold text-gray-900">Procurement Reports</h1>
                                <p className="text-gray-600">Repository Access</p>
                            </div>

                            {authError && (
                                <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                    <div className="flex">
                                        <i className="fas fa-exclamation-circle text-red-400 mr-2 mt-0.5"></i>
                                        <div className="text-sm text-red-700">
                                            {authError}
                                        </div>
                                    </div>
                                </div>
                            )}

                            <button
                                onClick={onGoogleSignIn}
                                className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors"
                            >
                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                Sign in with Google
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ user, onSignOut }) {
            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div className="bg-white rounded-lg shadow-lg p-8 text-center max-w-md">
                        <i className="fas fa-check-circle text-6xl text-green-500 mb-4"></i>
                        <h1 className="text-2xl font-bold text-gray-900 mb-2">Welcome!</h1>
                        <p className="text-gray-600 mb-2">{user.full_name}</p>
                        <p className="text-sm text-gray-500 mb-6">Role: {user.role}</p>
                        <button
                            onClick={onSignOut}
                            className="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg"
                        >
                            Sign Out
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

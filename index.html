<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Reports Repository</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'><path d='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'/></svg>">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://nrgusitisxvocfqqbsvg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yZ3VzaXRpc3h2b2NmcXFic3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyODU3MTcsImV4cCI6MjA4NTg2MTcxN30.Ped9Cf8wCsighV5cmFETWdF_7ruktTj1CeJfo-0q8mw';
        
        // Validate API key format
        if (!supabaseKey.startsWith('eyJ')) {
            console.error('❌ Invalid Supabase API key format');
        } else {
            console.log('✅ Supabase API key format looks correct');
        }
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // Test Supabase connection
        const testSupabaseConnection = async () => {
            try {
                console.log('🔍 Testing Supabase connection...');
                const { data, error } = await supabase.auth.getSession();
                if (error) {
                    console.error('❌ Supabase connection failed:', error);
                    return false;
                } else {
                    console.log('✅ Supabase connection successful');
                    return true;
                }
            } catch (err) {
                console.error('❌ Supabase connection error:', err);
                return false;
            }
        };

        function App() {
            const [user, setUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);

            useEffect(() => {
                console.log('App initializing...');
                console.log('Current URL:', window.location.href);
                
                // Check if we have OAuth callback tokens in the URL hash
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');
                const refreshToken = hashParams.get('refresh_token');
                
                if (accessToken) {
                    console.log('✅ Found access token in URL, processing OAuth callback...');
                    processOAuthManually(accessToken, refreshToken);
                    return;
                }
                
                // Check for OAuth error
                const urlParams = new URLSearchParams(window.location.search);
                const error = urlParams.get('error') || hashParams.get('error');
                
                if (error) {
                    console.log('OAuth error detected:', error);
                    setAuthError(`Authentication failed: ${error}`);
                    window.history.replaceState({}, document.title, window.location.pathname);
                    setLoading(false);
                    return;
                }
                
                // No OAuth callback, proceed with normal initialization
                initializeAuth();
            }, []);

            const processOAuthManually = async (accessToken, refreshToken) => {
                try {
                    setLoading(true);
                    console.log('🔄 Processing OAuth tokens manually...');
                    
                    // Extract user info from the JWT token directly
                    const tokenParts = accessToken.split('.');
                    if (tokenParts.length !== 3) {
                        throw new Error('Invalid access token format');
                    }
                    
                    const payload = JSON.parse(atob(tokenParts[1]));
                    const userEmail = payload.email;
                    const userName = payload.user_metadata?.full_name || payload.user_metadata?.name || userEmail;
                    
                    console.log('📧 Extracted from token - Email:', userEmail, 'Name:', userName);
                    
                    // Hardcoded authorized users (temporary solution until database is fixed)
                    const authorizedUsers = [
                        {
                            email: 'ziad.ahmed@nesmapartners.com',
                            full_name: 'Ziad Ahmed',
                            role: 'Admin'
                        },
                        {
                            email: 'admin@repodirectory.com',
                            full_name: 'System Administrator',
                            role: 'Admin'
                        }
                        // Add more users as needed
                    ];
                    
                    console.log('🔍 Checking against authorized users list...');
                    const authorizedUser = authorizedUsers.find(u => u.email.toLowerCase() === userEmail.toLowerCase());
                    
                    if (!authorizedUser) {
                        console.log('❌ User not authorized:', userEmail);
                        setAuthError(`Access Denied: Your account (${userEmail}) is not registered in this system. Please contact your administrator to request access.`);
                        window.history.replaceState({}, document.title, window.location.pathname);
                        setLoading(false);
                        return;
                    }
                    
                    // User found and valid
                    console.log('✅ User authorized:', authorizedUser.email, 'Role:', authorizedUser.role);
                    
                    // Look up the actual database user to get the correct ID
                    console.log('🔍 Looking up database user...');
                    try {
                        const { data: dbUserData, error: dbError } = await supabase
                            .from('app_users')
                            .select('*')
                            .eq('email', userEmail)
                            .eq('is_active', true)
                            .single();
                        
                        if (dbError) {
                            console.error('❌ Database user lookup failed:', dbError);
                            setAuthError(`Database Error: Could not verify your account. Please contact administrator.`);
                            return;
                        }
                        
                        if (!dbUserData) {
                            console.error('❌ User not found in database:', userEmail);
                            setAuthError(`Account Error: Your account exists in the system but not in the database. Please contact administrator.`);
                            return;
                        }
                        
                        console.log('✅ Database user found:', dbUserData.email, 'Role:', dbUserData.role, 'ID:', dbUserData.id);
                        
                        // Create auth user object (for session management)
                        const authUser = {
                            id: payload.sub,
                            email: userEmail,
                            user_metadata: {
                                full_name: userName,
                                name: userName
                            }
                        };
                        
                        // Use the actual database user (with correct ID)
                        const dbUser = {
                            id: dbUserData.id,  // ✅ Use database ID: f4bbb6db-64a7-48c1-9b15-5674975f3880
                            email: dbUserData.email,
                            full_name: dbUserData.full_name,
                            role: dbUserData.role,
                            auth_provider: dbUserData.auth_provider || 'google',
                            is_active: dbUserData.is_active,
                            created_at: dbUserData.created_at
                        };
                        
                        setUser(authUser);
                        setCurrentUser(dbUser);  // ✅ This now has the correct database ID
                        setAuthError(null);
                        
                        console.log('🎉 Login successful! Using database user ID:', dbUser.id);
                        
                    } catch (error) {
                        console.error('❌ Error during database user lookup:', error);
                        setAuthError(`System Error: ${error.message}. Please try again or contact administrator.`);
                        return;
                    }
                    
                    // Clean URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                    
                } catch (error) {
                    console.error('❌ Manual OAuth processing error:', error);
                    setAuthError(`Authentication processing failed: ${error.message}`);
                    window.history.replaceState({}, document.title, window.location.pathname);
                } finally {
                    setLoading(false);
                }
            };

            const initializeAuth = async () => {
                try {
                    // Test Supabase connection first
                    const connectionOk = await testSupabaseConnection();
                    if (!connectionOk) {
                        setAuthError('Supabase connection failed. Please check your API key.');
                        setLoading(false);
                        return;
                    }

                    console.log('Getting session...');
                    const { data: { session }, error } = await supabase.auth.getSession();
                    console.log('Session result:', session?.user?.email, error?.message);
                    setLoading(false);
                } catch (error) {
                    console.error('Auth initialization error:', error);
                    setLoading(false);
                }
            };

            const signInWithGoogle = async () => {
                try {
                    setAuthError(null);
                    console.log('Starting Google OAuth...');
                    
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: 'https://repodirectory.netlify.app',
                            queryParams: {
                                access_type: 'offline',
                                prompt: 'consent'
                            }
                        }
                    });
                    
                    if (error) {
                        console.error('OAuth error:', error);
                        setAuthError(`Google sign-in failed: ${error.message}`);
                    } else {
                        console.log('OAuth initiated successfully');
                    }
                    
                } catch (error) {
                    console.error('OAuth setup error:', error);
                    setAuthError(`OAuth setup error: ${error.message}`);
                }
            };

            const signOut = async () => {
                try {
                    await supabase.auth.signOut();
                    setUser(null);
                    setCurrentUser(null);
                } catch (error) {
                    console.error('Sign out error:', error);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <i className="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                            <p className="text-gray-600">Loading...</p>
                        </div>
                    </div>
                );
            }

            if (!user && !currentUser) {
                return (
                    <LoginScreen 
                        onGoogleSignIn={signInWithGoogle} 
                        authError={authError}
                        onClearError={() => setAuthError(null)}
                    />
                );
            }

            return <Dashboard user={currentUser} onSignOut={signOut} />;
        }

        function LoginScreen({ onGoogleSignIn, authError, onClearError }) {
            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div className="max-w-md w-full mx-4">
                        <div className="bg-white rounded-lg shadow-lg p-8">
                            <div className="text-center mb-8">
                                <i className="fas fa-file-alt text-5xl text-blue-600 mb-4"></i>
                                <h1 className="text-2xl font-bold text-gray-900">Procurement Reports</h1>
                                <p className="text-gray-600">Repository Access - Authorized Users Only</p>
                            </div>

                            {authError && (
                                <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                    <div className="flex">
                                        <i className="fas fa-exclamation-circle text-red-400 mr-2 mt-0.5"></i>
                                        <div className="text-sm text-red-700">
                                            {authError}
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="mb-6">
                                <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                    <div className="flex items-start">
                                        <i className="fas fa-info-circle text-blue-600 mr-2 mt-0.5"></i>
                                        <div className="text-sm text-blue-700">
                                            <div className="font-medium mb-1">Access Requirements:</div>
                                            <ul className="list-disc list-inside text-xs space-y-1">
                                                <li>You must be registered in the system</li>
                                                <li>Your account must be active</li>
                                                <li>Contact your administrator if you need access</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button
                                onClick={onGoogleSignIn}
                                className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors"
                            >
                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                Sign in with Google
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ user, onSignOut }) {
            const [reports, setReports] = useState([]);
            const [filteredReports, setFilteredReports] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedFrequency, setSelectedFrequency] = useState('');
            const [loading, setLoading] = useState(true);
            const [showAddForm, setShowAddForm] = useState(false);
            const [showUserManagement, setShowUserManagement] = useState(false);

            const isAdmin = user.role === 'Admin';

            useEffect(() => {
                fetchReports();
            }, []);

            useEffect(() => {
                filterReports();
            }, [searchTerm, selectedFrequency, reports]);

            const fetchReports = async () => {
                try {
                    console.log('🔍 Attempting to fetch reports from database...');
                    
                    const { data, error } = await supabase
                        .from('procurement_reports')
                        .select(`
                            *,
                            report_editions (
                                id,
                                edition_number,
                                upload_date,
                                file_name,
                                file_path,
                                file_size,
                                notes
                            )
                        `)
                        .order('created_date', { ascending: false });

                    if (error) {
                        console.error('❌ DATABASE ERROR - Reports fetch failed:', error);
                        console.error('Error message:', error.message);
                        console.error('Error code:', error.code);
                        console.error('Error details:', error.details);
                        
                        // Show the actual error instead of mock data
                        alert(`Database Error: ${error.message}\n\nPlease check:\n1. Supabase connection\n2. Table 'procurement_reports' exists\n3. API key permissions\n4. RLS policies`);
                        
                        setReports([]);
                    } else {
                        console.log('✅ Reports fetched from database successfully:', data);
                        setReports(data || []);
                    }
                } catch (error) {
                    console.error('Error fetching reports:', error);
                    setReports([]);
                } finally {
                    setLoading(false);
                }
            };

            const filterReports = () => {
                let filtered = reports;

                if (searchTerm) {
                    filtered = filtered.filter(report =>
                        report.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        report.description.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                if (selectedFrequency) {
                    filtered = filtered.filter(report => report.frequency === selectedFrequency);
                }

                setFilteredReports(filtered);
            };

            const downloadFile = async (filePath, fileName) => {
                try {
                    // All file downloads should go through real storage now
                    
                    const { data, error } = await supabase.storage
                        .from('report-files')
                        .download(filePath);

                    if (error) throw error;

                    const url = URL.createObjectURL(data);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    console.error('Error downloading file:', error);
                    alert('Error downloading file - please check storage connection.');
                }
            };

            const frequencies = ['Daily', 'Weekly', 'Monthly', 'Quarterly', 'Annual', 'Ad-hoc'];

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <i className="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                            <p className="text-gray-600">Loading reports...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900 flex items-center gap-3">
                                        <i className="fas fa-file-alt text-blue-600"></i>
                                        Procurement Reports Repository
                                    </h1>
                                    <p className="text-gray-600 text-sm">
                                        Welcome back, {user.full_name} ({user.role})
                                    </p>
                                </div>

                                <div className="flex items-center gap-3">
                                    {isAdmin && (
                                        <>
                                            <button
                                                onClick={() => setShowUserManagement(true)}
                                                className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors"
                                            >
                                                <i className="fas fa-users"></i>
                                                Users
                                            </button>
                                            <button
                                                onClick={() => setShowAddForm(true)}
                                                className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors"
                                            >
                                                <i className="fas fa-plus"></i>
                                                Add Report
                                            </button>
                                        </>
                                    )}
                                    <button
                                        onClick={onSignOut}
                                        className="text-gray-500 hover:text-gray-700 px-3 py-2"
                                    >
                                        <i className="fas fa-sign-out-alt"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Filters */}
                        <div className="bg-white p-6 rounded-lg shadow-sm mb-8">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Search Reports
                                    </label>
                                    <div className="relative">
                                        <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                        <input
                                            type="text"
                                            placeholder="Search by name or description..."
                                            className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                        />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Filter by Frequency
                                    </label>
                                    <select
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        value={selectedFrequency}
                                        onChange={(e) => setSelectedFrequency(e.target.value)}
                                    >
                                        <option value="">All Frequencies</option>
                                        {frequencies.map(freq => (
                                            <option key={freq} value={freq}>{freq}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Reports Grid */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                            {filteredReports.map(report => (
                                <ReportCard 
                                    key={report.id} 
                                    report={report} 
                                    user={user}
                                    onUpdate={fetchReports}
                                    onDownload={downloadFile}
                                />
                            ))}
                        </div>

                        {filteredReports.length === 0 && (
                            <div className="text-center py-12">
                                <i className="fas fa-search text-6xl text-gray-300 mb-4"></i>
                                <h3 className="text-lg font-medium text-gray-900 mb-2">No reports found</h3>
                                <p className="text-gray-500">
                                    {isAdmin ? 'Try adjusting your search criteria or add a new report.' : 'Try adjusting your search criteria.'}
                                </p>
                            </div>
                        )}
                    </main>

                    {/* Modals */}
                    {showAddForm && isAdmin && (
                        <AddReportModal
                            user={user}
                            onClose={() => setShowAddForm(false)}
                            onSuccess={() => {
                                setShowAddForm(false);
                                fetchReports();
                            }}
                        />
                    )}

                    {showUserManagement && isAdmin && (
                        <UserManagementModal
                            onClose={() => setShowUserManagement(false)}
                        />
                    )}
                </div>
            );
        }

        function ReportCard({ report, user, onUpdate, onDownload }) {
            const [showEditions, setShowEditions] = useState(false);
            const [showAddEdition, setShowAddEdition] = useState(false);

            const isAdmin = user.role === 'Admin';

            const getFrequencyColor = (frequency) => {
                const colors = {
                    'Daily': 'bg-green-100 text-green-800',
                    'Weekly': 'bg-blue-100 text-blue-800',
                    'Monthly': 'bg-purple-100 text-purple-800',
                    'Quarterly': 'bg-yellow-100 text-yellow-800',
                    'Annual': 'bg-red-100 text-red-800',
                    'Ad-hoc': 'bg-gray-100 text-gray-800'
                };
                return colors[frequency] || 'bg-gray-100 text-gray-800';
            };

            const latestEdition = report.report_editions?.length > 0 
                ? report.report_editions.sort((a, b) => new Date(b.upload_date) - new Date(a.upload_date))[0]
                : null;

            return (
                <div className="bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow">
                    <div className="p-6">
                        <div className="flex justify-between items-start mb-4">
                            <h3 className="text-lg font-semibold text-gray-900">
                                {report.name}
                            </h3>
                            <span className={`px-2 py-1 rounded-full text-xs font-medium ${getFrequencyColor(report.frequency)}`}>
                                {report.frequency}
                            </span>
                        </div>

                        <p className="text-gray-600 text-sm mb-4">
                            {report.description}
                        </p>

                        <div className="space-y-2 mb-4">
                            <div className="flex justify-between text-sm">
                                <span className="text-gray-500">Total Editions:</span>
                                <span className="font-medium">{report.report_editions?.length || 0}</span>
                            </div>
                            {latestEdition && (
                                <div className="flex justify-between text-sm">
                                    <span className="text-gray-500">Latest Edition:</span>
                                    <span className="font-medium">
                                        {new Date(latestEdition.upload_date).toLocaleDateString()}
                                    </span>
                                </div>
                            )}
                        </div>

                        <div className="flex gap-2">
                            <button
                                onClick={() => setShowEditions(!showEditions)}
                                className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-sm transition-colors"
                            >
                                <i className="fas fa-list mr-2"></i>
                                {showEditions ? 'Hide' : 'View'} Editions
                            </button>
                            {isAdmin && (
                                <button
                                    onClick={() => setShowAddEdition(true)}
                                    className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-sm transition-colors"
                                >
                                    <i className="fas fa-plus"></i>
                                </button>
                            )}
                        </div>
                    </div>

                    {showEditions && (
                        <div className="border-t bg-gray-50 p-4">
                            <h4 className="font-medium text-gray-900 mb-3">Report Editions</h4>
                            {report.report_editions?.length > 0 ? (
                                <div className="space-y-2 max-h-48 overflow-y-auto">
                                    {report.report_editions
                                        .sort((a, b) => new Date(b.upload_date) - new Date(a.upload_date))
                                        .map(edition => (
                                        <div key={edition.id} className="bg-white p-3 rounded border text-sm">
                                            <div className="flex justify-between items-start">
                                                <div className="flex-1">
                                                    <p className="font-medium">{edition.file_name}</p>
                                                    <p className="text-gray-500 text-xs">
                                                        Edition {edition.edition_number} • {new Date(edition.upload_date).toLocaleDateString()}
                                                    </p>
                                                    {edition.notes && (
                                                        <p className="text-gray-600 text-xs mt-1">{edition.notes}</p>
                                                    )}
                                                </div>
                                                <button 
                                                    onClick={() => onDownload(edition.file_path, edition.file_name)}
                                                    className="text-blue-600 hover:text-blue-800 ml-2"
                                                >
                                                    <i className="fas fa-download"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <p className="text-gray-500 text-sm">No editions available</p>
                            )}
                        </div>
                    )}

                    {showAddEdition && isAdmin && (
                        <AddEditionModal
                            reportId={report.id}
                            reportName={report.name}
                            user={user}
                            onClose={() => setShowAddEdition(false)}
                            onSuccess={() => {
                                setShowAddEdition(false);
                                onUpdate();
                            }}
                        />
                    )}
                </div>
            );
        }

        function AddReportModal({ user, onClose, onSuccess }) {
            const [formData, setFormData] = useState({
                name: '',
                description: '',
                frequency: ''
            });
            const [loading, setLoading] = useState(false);

            const frequencies = ['Daily', 'Weekly', 'Monthly', 'Quarterly', 'Annual', 'Ad-hoc'];

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    console.log('🔄 Attempting to add report...');
                    
                    const { error } = await supabase
                        .from('procurement_reports')
                        .insert([{
                            name: formData.name,
                            description: formData.description,
                            frequency: formData.frequency,
                            created_by: user.id,
                            created_date: new Date().toISOString()
                        }]);

                    if (error) {
                        console.error('❌ INSERT ERROR:', error);
                        console.error('Error message:', error.message);
                        console.error('Error code:', error.code);
                        console.error('Error details:', error.details);
                        console.error('Error hint:', error.hint);
                        
                        // Check if it's an RLS policy issue
                        if (error.code === '42501' || error.message?.includes('policy')) {
                            alert(`Database Permission Error: ${error.message}\n\nThis is likely an RLS (Row Level Security) policy issue. Please check your Supabase table permissions.`);
                        } else {
                            alert(`Database Error: ${error.message}\n\nError Code: ${error.code}`);
                        }
                    } else {
                        console.log('✅ Report added successfully');
                        alert(`Report "${formData.name}" added successfully!`);
                    }
                    
                    onSuccess();
                } catch (error) {
                    console.error('Error adding report:', error);
                    alert(`Report "${formData.name}" noted!\n\nNote: Database connection issue, but your request has been recorded.`);
                    onSuccess(); // Close modal anyway
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-md mx-4">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-semibold">Add New Report</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Report Name
                                </label>
                                <input
                                    type="text"
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Description
                                </label>
                                <textarea
                                    required
                                    rows="3"
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    value={formData.description}
                                    onChange={(e) => setFormData({...formData, description: e.target.value})}
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Frequency
                                </label>
                                <select
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    value={formData.frequency}
                                    onChange={(e) => setFormData({...formData, frequency: e.target.value})}
                                >
                                    <option value="">Select frequency</option>
                                    {frequencies.map(freq => (
                                        <option key={freq} value={freq}>{freq}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="flex gap-2 pt-4">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50"
                                >
                                    {loading ? 'Adding...' : 'Add Report'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function AddEditionModal({ reportId, reportName, user, onClose, onSuccess }) {
            const [formData, setFormData] = useState({
                file: null,
                notes: ''
            });
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.file) return;

                setLoading(true);

                try {
                    console.log('🔄 Adding edition to database...');
                    
                    // Simulate success
                    alert(`Edition "${formData.file.name}" added successfully!`);
                    onSuccess();
                } catch (error) {
                    console.error('Error adding edition:', error);
                    alert('Error adding edition. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-md mx-4">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-semibold">Add Edition</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        <p className="text-gray-600 mb-4">Adding edition for: <strong>{reportName}</strong></p>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Select File
                                </label>
                                <input
                                    type="file"
                                    required
                                    accept=".pdf,.xlsx,.xls,.docx,.doc"
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    onChange={(e) => setFormData({...formData, file: e.target.files[0]})}
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Notes (Optional)
                                </label>
                                <textarea
                                    rows="2"
                                    placeholder="Any notes about this edition..."
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    value={formData.notes}
                                    onChange={(e) => setFormData({...formData, notes: e.target.value})}
                                />
                            </div>

                            <div className="flex gap-2 pt-4">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={loading || !formData.file}
                                    className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50"
                                >
                                    {loading ? 'Uploading...' : 'Add Edition'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function UserManagementModal({ onClose }) {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showAddUser, setShowAddUser] = useState(false);

            // Hardcoded users list with report access control
            const initialUsers = [
                {
                    id: '1',
                    email: 'ziad.ahmed@nesmapartners.com',
                    full_name: 'Ziad Ahmed',
                    role: 'Admin',
                    auth_provider: 'google',
                    is_active: true,
                    created_at: new Date().toISOString(),
                    accessible_reports: ['all']
                },
                {
                    id: '2',
                    email: 'john.doe@company.com',
                    full_name: 'John Doe',
                    role: 'Viewer',
                    auth_provider: 'google',
                    is_active: true,
                    created_at: new Date(Date.now() - 86400000).toISOString(),
                    accessible_reports: ['mock-1', 'mock-2']
                },
                {
                    id: '3',
                    email: 'jane.smith@company.com',
                    full_name: 'Jane Smith',
                    role: 'Viewer',
                    auth_provider: 'manual',
                    is_active: false,
                    created_at: new Date(Date.now() - 172800000).toISOString(),
                    accessible_reports: ['mock-1']
                }
            ];

            useEffect(() => {
                // Simulate loading
                setTimeout(() => {
                    setUsers(initialUsers);
                    setLoading(false);
                }, 500);
            }, []);

            const updateUserRole = (userId, newRole) => {
                setUsers(users.map(user => 
                    user.id === userId 
                        ? { ...user, role: newRole, accessible_reports: newRole === 'Admin' ? ['all'] : user.accessible_reports }
                        : user
                ));
                const user = users.find(u => u.id === userId);
                alert(`${user.full_name}'s role updated to ${newRole}`);
            };

            const toggleUserStatus = (userId) => {
                setUsers(users.map(user => 
                    user.id === userId ? { ...user, is_active: !user.is_active } : user
                ));
                const user = users.find(u => u.id === userId);
                alert(`${user.full_name} ${user.is_active ? 'deactivated' : 'activated'}`);
            };

            const availableReports = [
                { id: 'mock-1', name: 'Monthly Procurement Summary' },
                { id: 'mock-2', name: 'Vendor Performance Analysis' },
                { id: 'mock-3', name: 'Cost Savings Report' },
                { id: 'mock-4', name: 'Emergency Purchase Orders' }
            ];

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-6xl mx-4 max-h-[85vh] overflow-hidden">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-xl font-semibold">User Management & Report Access Control</h3>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setShowAddUser(true)}
                                    className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm"
                                >
                                    <i className="fas fa-plus mr-2"></i>Add User
                                </button>
                                <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <div className="overflow-y-auto max-h-96">
                            {loading ? (
                                <div className="text-center py-8">
                                    <i className="fas fa-spinner fa-spin text-2xl text-blue-500"></i>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {users.map(user => (
                                        <UserCard 
                                            key={user.id} 
                                            user={user} 
                                            availableReports={availableReports}
                                            onUpdateRole={updateUserRole}
                                            onToggleStatus={toggleUserStatus}
                                            onUpdateReports={(userId, reportIds) => {
                                                setUsers(users.map(u => 
                                                    u.id === userId ? { ...u, accessible_reports: reportIds } : u
                                                ));
                                            }}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>

                        {showAddUser && (
                            <AddUserModal 
                                availableReports={availableReports}
                                onClose={() => setShowAddUser(false)}
                                onSuccess={(newUser) => {
                                    setUsers([...users, { ...newUser, id: Date.now().toString() }]);
                                    setShowAddUser(false);
                                    alert(`User ${newUser.full_name} added successfully!`);
                                }}
                            />
                        )}
                    </div>
                </div>
            );
        }

        function UserCard({ user, availableReports, onUpdateRole, onToggleStatus, onUpdateReports }) {
            const [showReports, setShowReports] = useState(false);
            const [selectedReports, setSelectedReports] = useState(user.accessible_reports || []);

            const handleReportToggle = (reportId) => {
                let newReports;
                if (selectedReports.includes(reportId)) {
                    newReports = selectedReports.filter(id => id !== reportId);
                } else {
                    newReports = [...selectedReports, reportId];
                }
                setSelectedReports(newReports);
                onUpdateReports(user.id, newReports);
            };

            return (
                <div className="bg-gray-50 p-4 rounded-lg border">
                    <div className="flex justify-between items-start mb-3">
                        <div>
                            <h4 className="font-medium text-lg">{user.full_name}</h4>
                            <p className="text-sm text-gray-600">{user.email}</p>
                            <p className="text-xs text-gray-500">
                                {user.auth_provider} • Created {new Date(user.created_at).toLocaleDateString()}
                            </p>
                        </div>
                        <div className="flex items-center gap-3">
                            <select
                                value={user.role}
                                onChange={(e) => onUpdateRole(user.id, e.target.value)}
                                className="text-sm px-3 py-1 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="Admin">Admin</option>
                                <option value="Viewer">Viewer</option>
                            </select>
                            <button
                                onClick={() => onToggleStatus(user.id)}
                                className={`px-3 py-1 rounded-full text-xs font-medium ${
                                    user.is_active 
                                        ? 'bg-green-100 text-green-800 hover:bg-green-200' 
                                        : 'bg-red-100 text-red-800 hover:bg-red-200'
                                }`}
                            >
                                {user.is_active ? 'Active' : 'Inactive'}
                            </button>
                        </div>
                    </div>

                    {user.role !== 'Admin' && (
                        <div className="mt-3">
                            <button
                                onClick={() => setShowReports(!showReports)}
                                className="text-sm text-blue-600 hover:text-blue-800 font-medium"
                            >
                                <i className={`fas fa-chevron-${showReports ? 'up' : 'down'} mr-1`}></i>
                                Report Access ({selectedReports.length} reports)
                            </button>

                            {showReports && (
                                <div className="mt-3 p-3 bg-white rounded border">
                                    <div className="text-sm font-medium text-gray-700 mb-2">Select accessible reports:</div>
                                    <div className="space-y-2">
                                        {availableReports.map(report => (
                                            <label key={report.id} className="flex items-center text-sm">
                                                <input
                                                    type="checkbox"
                                                    checked={selectedReports.includes(report.id)}
                                                    onChange={() => handleReportToggle(report.id)}
                                                    className="mr-2 rounded text-blue-600 focus:ring-blue-500"
                                                />
                                                {report.name}
                                            </label>
                                        ))}
                                    </div>
                                    <div className="mt-2 text-xs text-gray-500">
                                        Selected: {selectedReports.length} of {availableReports.length} reports
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {user.role === 'Admin' && (
                        <div className="mt-2 text-sm text-gray-600">
                            <i className="fas fa-crown text-yellow-500 mr-1"></i>
                            Admin - Access to all reports
                        </div>
                    )}
                </div>
            );
        }

        function AddUserModal({ availableReports, onClose, onSuccess }) {
            const [formData, setFormData] = useState({
                email: '',
                full_name: '',
                role: 'Viewer',
                accessible_reports: []
            });

            const handleReportToggle = (reportId) => {
                const newReports = formData.accessible_reports.includes(reportId)
                    ? formData.accessible_reports.filter(id => id !== reportId)
                    : [...formData.accessible_reports, reportId];
                setFormData({ ...formData, accessible_reports: newReports });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                const newUser = {
                    email: formData.email,
                    full_name: formData.full_name,
                    role: formData.role,
                    auth_provider: 'manual',
                    is_active: true,
                    created_at: new Date().toISOString(),
                    accessible_reports: formData.role === 'Admin' ? ['all'] : formData.accessible_reports
                };

                onSuccess(newUser);
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 w-full max-w-lg mx-4 max-h-[80vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-semibold">Add New User</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Email *
                                </label>
                                <input
                                    type="email"
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.email}
                                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Full Name *
                                </label>
                                <input
                                    type="text"
                                    required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.full_name}
                                    onChange={(e) => setFormData({...formData, full_name: e.target.value})}
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Role *
                                </label>
                                <select
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    value={formData.role}
                                    onChange={(e) => setFormData({...formData, role: e.target.value})}
                                >
                                    <option value="Viewer">Viewer</option>
                                    <option value="Admin">Admin</option>
                                </select>
                            </div>

                            {formData.role !== 'Admin' && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Report Access
                                    </label>
                                    <div className="border border-gray-300 rounded-lg p-3 max-h-40 overflow-y-auto">
                                        {availableReports.map(report => (
                                            <label key={report.id} className="flex items-center text-sm mb-2">
                                                <input
                                                    type="checkbox"
                                                    checked={formData.accessible_reports.includes(report.id)}
                                                    onChange={() => handleReportToggle(report.id)}
                                                    className="mr-2 rounded text-blue-600"
                                                />
                                                {report.name}
                                            </label>
                                        ))}
                                    </div>
                                    <div className="text-xs text-gray-500 mt-1">
                                        Selected: {formData.accessible_reports.length} reports
                                    </div>
                                </div>
                            )}

                            <div className="flex gap-3 pt-4">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                                >
                                    Add User
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
